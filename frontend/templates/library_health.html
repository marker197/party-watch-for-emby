<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Health - Emby-Simkl Suite</title>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <style>
    :root {
      --bg: #0F0F12;
      --surface: #18181E;
      --surface-hover: #22222A;
      --border: #2A2A35;
      --text: #E6EDF3;
      --text-dim: #7D8590;
      --accent: #E8B94A;
      --accent-light: #F0CA6B;
      --green: #4AAD6E;
      --orange: #E07D3A;
      --red: #E05252;
      --blue: #7B8CDE;
      --radius: 10px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body.light-mode {
      --bg: #F6F8FA; --surface: #FFFFFF; --surface-hover: #E8ECF1;
      --border: #D0D7DE; --text: #1F2328; --text-dim: #656D76;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:var(--font); line-height:1.6; min-height:100vh; }

    .header { padding:28px 32px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
    .header h1 { font-size:1.3rem; font-weight:700; }
    .container { max-width:1100px; margin:0 auto; padding:24px 32px 80px; }

    .user-row { display:flex; align-items:center; gap:12px; margin-bottom:24px; }
    .user-row label { font-size:0.85rem; color:var(--text-dim); }
    .user-row select { background:var(--surface); color:var(--text); border:1px solid var(--border); padding:6px 12px; border-radius:6px; font-size:0.85rem; }

    .btn { padding:8px 18px; border:none; border-radius:6px; font-size:0.82rem; font-weight:600; cursor:pointer; }
    .btn-accent { background:var(--accent); color:#fff; }
    .btn-accent:hover { opacity:0.9; }
    .btn-accent:disabled { opacity:0.5; cursor:not-allowed; }

    .summary-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:24px; }
    .summary-stat { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; text-align:center; }
    .summary-stat .val { font-size:1.5rem; font-weight:700; }
    .summary-stat .lbl { font-size:0.75rem; color:var(--text-dim); margin-top:2px; }

    .section { margin-bottom:32px; }
    .section h2 { font-size:1rem; font-weight:700; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--border); }
    .section h2 .count { font-weight:400; color:var(--text-dim); font-size:0.85rem; }

    .item-table { width:100%; border-collapse:collapse; font-size:0.82rem; }
    .item-table th { text-align:left; padding:8px 10px; color:var(--text-dim); font-weight:600; border-bottom:1px solid var(--border); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.3px; }
    .item-table td { padding:8px 10px; border-bottom:1px solid var(--border); }
    .item-table tr:hover { background:var(--surface-hover); }

    .pct-bar { display:inline-block; height:6px; border-radius:3px; background:var(--green); vertical-align:middle; }
    .pct-bar.low { background:var(--red); }
    .pct-bar.mid { background:var(--orange); }
    .pct-text { font-size:0.78rem; color:var(--text-dim); margin-left:6px; }

    .badge { display:inline-block; padding:1px 8px; border-radius:4px; font-size:0.72rem; font-weight:600; }
    .badge-movie { background:rgba(116,185,255,0.15); color:var(--blue); }
    .badge-show { background:rgba(61,154,86,0.15); color:var(--green); }
    .badge-rating { background:rgba(210,153,34,0.15); color:var(--orange); }

    .empty { color:var(--text-dim); padding:16px; text-align:center; font-size:0.85rem; }
    .loading { color:var(--text-dim); padding:24px; text-align:center; }
    .error { color:var(--red); padding:12px; }

    .imdb-link { color:var(--accent-light); text-decoration:none; }
    .imdb-link:hover { text-decoration:underline; }

    .toggle-btn { background:none; border:none; color:var(--accent-light); cursor:pointer; font-size:0.8rem; padding:4px 8px; }
  </style>
<script src="/static/js/csrf.js"></script>
</head>
<body>
<script>if(localStorage.getItem('suite-theme')==='light')document.body.classList.add('light-mode');</script>

<nav class="suite-nav" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#0F0F12;border-bottom:1px solid #2A2A35;padding:10px 24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <span style="color:#7D8590;font-size:0.85rem;font-weight:700;letter-spacing:0.5px;margin-right:10px;">EMBY-SIMKL SUITE</span>
    <a href="/" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#22222A'" onmouseout="this.style.background='transparent'">Dashboard</a>
    <a href="/lists" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#22222A'" onmouseout="this.style.background='transparent'">📋 Lists</a>
    <a href="/predictions" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#22222A'" onmouseout="this.style.background='transparent'">🤖 Predictions</a>
    <a href="/bias" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#22222A'" onmouseout="this.style.background='transparent'">🎓 Taste Profile</a>
    <a href="/rewatch" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#22222A'" onmouseout="this.style.background='transparent'">🔁 Rewatch</a>
    <a href="/stats" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#22222A'" onmouseout="this.style.background='transparent'">📊 Stats</a>
    <a href="/watch-history" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#22222A'" onmouseout="this.style.background='transparent'">📜 History</a>
    <a href="/library-health" style="color:#ffffff;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:#22222A;font-weight:600;">🏥 Library Health</a>
    <a href="/settings" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#22222A'" onmouseout="this.style.background='transparent'">⚙️ Settings</a>
    <a href="/watch-party" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#22222A'" onmouseout="this.style.background='transparent'">👥 Watch Party</a>
    <a href="/guide" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#22222A'" onmouseout="this.style.background='transparent'">📖 Guide</a>
</nav>

<div class="header">
  <h1>🏥 Library Health Monitor</h1>
  <div style="display:flex;gap:8px;align-items:center;">
    <button class="btn btn-accent" id="scanBtn" onclick="runScan()">🔍 Run Scan</button>
  </div>
</div>

<div class="container">
  <div class="user-row">
    <label>👤 User:</label>
    <select id="userSelect" onchange="loadReport()"></select>
    <span id="scanStatus" style="font-size:0.8rem;color:var(--text-dim);"></span>
  </div>

  <div id="content">
    <div class="loading">Select a user and run a scan to check library health.</div>
  </div>
</div>

<script>
function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let currentUserId = null;

async function loadUsers() {
  try {
    const r = await fetch('/auth/users');
    const users = await r.json();
    const sel = document.getElementById('userSelect');
    sel.innerHTML = users
      .filter(u => u.linked)
      .map(u => '<option value="' + u.id + '">' + escapeHtml(u.emby_username || u.emby_user_id) + '</option>')
      .join('');
    if (sel.options.length > 0) {
      currentUserId = parseInt(sel.value);
      loadReport();
    }
  } catch(e) {
    console.error('Failed to load users:', e);
  }
}

async function loadReport() {
  currentUserId = parseInt(document.getElementById('userSelect').value);
  if (!currentUserId) return;

  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">Loading report…</div>';

  try {
    const r = await fetch('/api/library-health/' + currentUserId);
    const data = await r.json();
    if (data.status === 'no_report') {
      content.innerHTML = '<div class="empty">No scan results yet. Click <strong>Run Scan</strong> to analyze your library.</div>';
      return;
    }
    renderReport(data);
  } catch(e) {
    content.innerHTML = '<div class="error">Failed to load report: ' + escapeHtml(e.message) + '</div>';
  }
}

async function runScan() {
  currentUserId = parseInt(document.getElementById('userSelect').value);
  if (!currentUserId) return;

  const btn = document.getElementById('scanBtn');
  const status = document.getElementById('scanStatus');
  btn.disabled = true;
  btn.textContent = '⏳ Scanning…';
  status.textContent = 'This may take a minute — checking Simkl history against your library…';

  const content = document.getElementById('content');

  try {
    const r = await fetch('/api/library-health/' + currentUserId + '/scan', {method:'POST'});
    const data = await r.json();
    if (data.error) {
      content.innerHTML = '<div class="error">Scan error: ' + escapeHtml(data.error) + '</div>';
    } else {
      renderReport(data);
    }
    const secs = (data.summary || {}).scan_seconds || '?';
    status.textContent = 'Scan complete in ' + secs + 's';
  } catch(e) {
    content.innerHTML = '<div class="error">Scan failed: ' + escapeHtml(e.message) + '</div>';
    status.textContent = '';
  } finally {
    btn.disabled = false;
    btn.textContent = '🔍 Run Scan';
  }
}

async function dismissHealthItem(type, id, btn) {
  if (!currentUserId || !id) return;
  btn.disabled = true;
  btn.textContent = '⏳';
  try {
    const r = await fetch('/api/library-health/' + currentUserId + '/dismiss', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({type: type, id: id}),
    });
    if (r.ok) {
      removeRowAndUpdateCount(btn);
      showNotification('Item dismissed');
    } else {
      btn.textContent = '✕';
      btn.disabled = false;
    }
  } catch(e) {
    btn.textContent = '✕';
    btn.disabled = false;
  }
}

async function undismissAll() {
  if (!currentUserId) return;
  if (!confirm('Restore all dismissed items? They will reappear on the next scan.')) return;
  try {
    await fetch('/api/library-health/' + currentUserId + '/undismiss-all', {method:'POST'});
    showNotification('All dismissed items restored — click Run Scan to refresh.');
    loadReport();
  } catch(e) {
    showNotification('Failed to restore: ' + e.message);
  }
}

function renderReport(data) {
  const s = data.summary || {};

  let html = '';

  // Scan info
  if (data.scanned_at) {
    const d = new Date(data.scanned_at);
    html += '<div style="display:flex;align-items:center;gap:12px;color:var(--text-dim);font-size:0.8rem;margin-bottom:16px;">'
      + '<span>Scanned ' + d.toLocaleString() + ' · took ' + (s.scan_seconds || '?') + 's · ' + (s.total_issues || 0) + ' item' + (s.total_issues !== 1 ? 's' : '') + ' found</span>'
      + '<button class="btn" style="background:none;border:1px solid var(--text-dim);color:var(--text-dim);padding:2px 10px;font-size:0.72rem;border-radius:4px;" '
      + 'onclick="undismissAll()" title="Restore all previously dismissed items">Restore Dismissed</button>'
      + '</div>';
  }

  // Summary stats
  html += '<div class="summary-row">';
  html += statBox(s.incomplete_series || 0, 'Incomplete Series');
  html += statBox(s.movies_not_in_library || 0, 'Watched Movies Missing');
  html += statBox(s.shows_not_in_library || 0, 'Watched Shows Missing');
  html += statBox(s.missing_sequels || 0, 'Missing Related');
  html += '</div>';

  // Sections
  html += renderIncomplete(data.incomplete_series || []);
  html += renderMissing('Watched Movies Not in Library', data.watched_not_in_library?.movies || [], 'movie');
  html += renderMissing('Watched Shows Not in Library', data.watched_not_in_library?.shows || [], 'show');
  html += renderSequels(data.missing_sequels || []);

  document.getElementById('content').innerHTML = html;
}

function statBox(val, label) {
  return '<div class="summary-stat"><div class="val">' + val + '</div><div class="lbl">' + label + '</div></div>';
}

function titleLink(it) {
  if (it.imdb_id) return '<a class="imdb-link" href="https://www.imdb.com/title/' + escapeHtml(it.imdb_id) + '/" target="_blank">' + escapeHtml(it.title) + '</a>';
  if (it.tmdb_id) return '<a class="imdb-link" href="https://www.themoviedb.org/' + (it.item_type === 'show' || it.tvdb_id ? 'tv' : 'movie') + '/' + escapeHtml(String(it.tmdb_id)) + '" target="_blank">' + escapeHtml(it.title) + '</a>';
  return escapeHtml(it.title);
}

function renderIncomplete(items) {
  if (!items.length) return '<div class="section"><h2>📺 Incomplete Series <span class="count">(0)</span></h2><div class="empty">All series fully watched!</div></div>';

  let html = '<div class="section"><h2>📺 Incomplete Series <span class="count">(' + items.length + ')</span></h2>';
  html += '<table class="item-table"><thead><tr><th>Title</th><th>Progress</th><th>Played</th><th>Remaining</th></tr></thead><tbody>';
  for (const it of items) {
    const pct = it.completion_pct || 0;
    const barClass = pct < 30 ? 'low' : pct < 70 ? 'mid' : '';
    const link = titleLink(it);
    html += '<tr><td>' + link + (it.year ? ' <span style="color:var(--text-dim);">(' + it.year + ')</span>' : '') + '</td>';
    html += '<td><span class="pct-bar ' + barClass + '" style="width:' + Math.max(4, pct * 0.8) + 'px;"></span><span class="pct-text">' + pct + '%</span></td>';
    html += '<td>' + (it.played_episodes || 0) + '</td>';
    html += '<td>' + (it.unplayed_episodes || 0) + ' eps</td></tr>';
  }
  html += '</tbody></table></div>';
  return html;
}

function renderMissing(title, items, type) {
  const icon = type === 'movie' ? '🎬' : '📺';
  if (!items.length) return '<div class="section"><h2>' + icon + ' ' + title + ' <span class="count">(0)</span></h2><div class="empty">Everything in sync!</div></div>';

  let html = '<div class="section"><h2>' + icon + ' ' + escapeHtml(title) + ' <span class="count">(' + items.length + ')</span></h2>';
  html += '<table class="item-table"><thead><tr><th>Title</th><th>Year</th>';
  if (type === 'show') html += '<th>Episodes</th>';
  html += '<th>Last Watched</th><th></th><th></th></tr></thead><tbody>';
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    const itemId = it.imdb_id || it.tmdb_id || it.tvdb_id || it.simkl_id || '';
    const link = titleLink(it);
    html += '<tr><td>' + link + '</td><td>' + (it.year || '') + '</td>';
    if (type === 'show') html += '<td>' + (it.episodes_watched || '') + '</td>';
    const lw = it.last_watched ? new Date(it.last_watched).toLocaleDateString() : '';
    html += '<td style="color:var(--text-dim);">' + lw + '</td>';
    html += '<td>' + arrButton(type, it, 'miss-' + type + '-' + i) + '</td>';
    html += '<td><button class="btn" style="background:none;border:1px solid var(--text-dim);color:var(--text-dim);padding:2px 6px;font-size:0.7rem;border-radius:4px;" '
      + 'onclick="dismissHealthItem(\'' + type + '\',\'' + escapeHtml(String(itemId)) + '\',this)" title="Dismiss — hide from future reports">✕</button></td>';
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  return html;
}

function renderSequels(items) {
  if (!items.length) return '<div class="section"><h2>🔗 Simkl Suggestions <span class="count">(0)</span></h2><div class="empty">No missing related items found!</div></div>';

  let html = '<div class="section"><h2>🔗 Simkl Suggestions <span class="count">(' + items.length + ')</span></h2>';
  html += '<table class="item-table"><thead><tr><th>Missing Title</th><th>Year</th><th>Type</th><th>Related To</th><th>Your Rating</th><th></th><th></th></tr></thead><tbody>';
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    const link = titleLink(it);
    const isShow = it.item_type === 'show';
    const itemType = isShow ? 'show' : 'movie';
    const typeBadge = isShow
      ? '<span class="badge" style="background:rgba(77,184,122,0.15);color:#4AAD6E;font-size:0.65rem;">📺 Show</span>'
      : '<span class="badge" style="background:rgba(123,140,222,0.2);color:#7B8CDE;font-size:0.65rem;">🎬 Movie</span>';
    const itemId = it.imdb_id || it.tmdb_id || it.tvdb_id || it.simkl_id || '';
    html += '<tr><td>' + link + '</td><td>' + (it.year || '') + '</td>';
    html += '<td>' + typeBadge + '</td>';
    html += '<td>' + escapeHtml(it.related_to || '') + '</td>';
    html += '<td><span class="badge badge-rating">★ ' + (it.your_rating || '?') + '</span></td>';
    html += '<td>' + arrButton(itemType, it, 'seq-' + i) + '</td>';
    html += '<td><button class="btn" style="background:none;border:1px solid var(--text-dim);color:var(--text-dim);padding:2px 6px;font-size:0.7rem;border-radius:4px;" '
      + 'onclick="dismissHealthItem(\'' + itemType + '\',\'' + escapeHtml(String(itemId)) + '\',this)" title="Dismiss — hide from future reports">✕</button></td></tr>';
  }
  html += '</tbody></table></div>';
  return html;
}

let _radarrServers = [];
let _sonarrServers = [];

async function _loadArrServers() {
  try {
    const [rr, sr] = await Promise.all([
      fetch('/api/radarr/servers').then(r => r.json()),
      fetch('/api/sonarr/servers').then(r => r.json()),
    ]);
    _radarrServers = rr.servers || [];
    _sonarrServers = sr.servers || [];
  } catch(e) { /* silent */ }
}

function arrButton(type, item, prefix) {
  const id = prefix + '-0';
  const safeTitle = escapeHtml((item.title || '').replace(/'/g, ''));
  if (type === 'movie') {
    const tmdbId = item.tmdb_id || '';
    const imdbId = item.imdb_id || '';
    if (!tmdbId && !imdbId) return '';
    if (_radarrServers.length > 1) {
      const opts = _radarrServers.map(function(s, si) {
        return '<option value="' + si + '">' + escapeHtml(s.quality_profile_name || s.name || ('Server ' + (si+1))) + '</option>';
      }).join('');
      return '<span style="display:inline-flex;align-items:center;gap:2px;">'
        + '<select id="radarr-sel-' + prefix + '" style="background:var(--surface-hover);color:var(--text);border:1px solid var(--red);border-radius:5px;padding:1px 2px;font-size:0.65rem;max-width:80px;">' + opts + '</select>'
        + '<button id="' + id + '" class="btn" style="background:#5865A6;color:#fff;padding:3px 8px;font-size:0.72rem;" '
        + 'onclick="sendToRadarr(\'' + id + '\',' + (tmdbId || 'null') + ',\'' + escapeHtml(imdbId) + '\',\'' + safeTitle + '\',' + (item.year||'null')
        + ',parseInt(document.getElementById(\'radarr-sel-' + prefix + '\').value))">📥</button></span>';
    }
    return '<button id="' + id + '" class="btn" style="background:#5865A6;color:#fff;padding:3px 10px;font-size:0.72rem;" '
      + 'onclick="sendToRadarr(\'' + id + '\',' + (tmdbId || 'null') + ',\'' + escapeHtml(imdbId) + '\',\'' + safeTitle + '\',' + (item.year||'null') + ',0)">'
      + '📥 Radarr</button>';
  } else {
    const tvdbId = item.tvdb_id || '';
    const imdbId = item.imdb_id || '';
    if (!tvdbId && !imdbId) return '';
    if (_sonarrServers.length > 1) {
      const opts = _sonarrServers.map(function(s, si) {
        return '<option value="' + si + '">' + escapeHtml(s.quality_profile_name || s.name || ('Server ' + (si+1))) + '</option>';
      }).join('');
      return '<span style="display:inline-flex;align-items:center;gap:2px;">'
        + '<select id="sonarr-sel-' + prefix + '" style="background:var(--surface-hover);color:var(--text);border:1px solid var(--blue);border-radius:5px;padding:1px 2px;font-size:0.65rem;max-width:80px;">' + opts + '</select>'
        + '<button id="' + id + '" class="btn" style="background:#27863A;color:#fff;padding:3px 8px;font-size:0.72rem;" '
        + 'onclick="sendToSonarr(\'' + id + '\',' + (tvdbId || 'null') + ',\'' + escapeHtml(imdbId) + '\',\'' + safeTitle + '\',' + (item.year||'null')
        + ',parseInt(document.getElementById(\'sonarr-sel-' + prefix + '\').value))">📥</button></span>';
    }
    return '<button id="' + id + '" class="btn" style="background:#27863A;color:#fff;padding:3px 10px;font-size:0.72rem;" '
      + 'onclick="sendToSonarr(\'' + id + '\',' + (tvdbId || 'null') + ',\'' + escapeHtml(imdbId) + '\',\'' + safeTitle + '\',' + (item.year||'null') + ',0)">'
      + '📥 Sonarr</button>';
  }
}

function removeRowAndUpdateCount(btn) {
  const row = btn.closest('tr');
  if (!row) return;
  const section = row.closest('.section');
  row.remove();
  if (section) {
    const countSpan = section.querySelector('h2 .count');
    if (countSpan) {
      const remaining = section.querySelectorAll('tbody tr').length;
      countSpan.textContent = '(' + remaining + ')';
    }
    // Update the matching summary stat
    const heading = section.querySelector('h2');
    if (heading) {
      const txt = heading.textContent;
      const remaining = section.querySelectorAll('tbody tr').length;
      const stats = document.querySelectorAll('.summary-stat');
      for (const stat of stats) {
        const lbl = stat.querySelector('.lbl');
        if (!lbl) continue;
        if ((txt.includes('Movies') && lbl.textContent.includes('Movies'))
         || (txt.includes('Shows') && lbl.textContent.includes('Shows'))
         || (txt.includes('Simkl Suggestions') && lbl.textContent.includes('Related'))) {
          stat.querySelector('.val').textContent = remaining;
        }
      }
    }
  }
}

function autoDismiss(type, id) {
  if (!currentUserId || !id) return;
  fetch('/api/library-health/' + currentUserId + '/dismiss', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({type: type, id: id}),
  }).catch(function() {});
}

function showNotification(msg) {
  const el = document.getElementById('scanStatus');
  if (el) el.textContent = msg;
  setTimeout(() => { if (el) el.textContent = ''; }, 4000);
}

async function sendToRadarr(btnId, tmdbId, imdbId, title, year, serverIdx) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  btn.disabled = true;
  btn.textContent = '⏳';
  try {
    const r = await fetch('/api/radarr/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        server_index: serverIdx || 0,
        movies: [{ tmdb_id: tmdbId, imdb_id: imdbId || undefined, title: title, year: year || undefined }]
      })
    });
    const d = await r.json();
    if (r.ok && d.added > 0) {
      btn.textContent = '✓ Sent';
      btn.style.background = 'var(--green)';
      showNotification(title + ' sent to ' + (_radarrServers[serverIdx]?.name || 'Radarr'));
      autoDismiss('movie', imdbId || String(tmdbId || ''));
      removeRowAndUpdateCount(btn);
    } else {
      const reason = (d.results && d.results[0] && d.results[0].reason) || d.detail || 'Failed';
      btn.textContent = '✗';
      btn.style.background = 'var(--red)';
      showNotification('Radarr: ' + reason);
    }
  } catch(e) {
    btn.textContent = '✗';
    btn.style.background = 'var(--red)';
    showNotification('Radarr error: ' + e.message);
  }
}
