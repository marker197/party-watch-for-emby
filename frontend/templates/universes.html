<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Universes - Emby-Trakt Suite</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-hover: #22263a;
      --border: #2a2e3e;
      --text: #e0e0e6;
      --text-dim: #8b8fa3;
      --accent: #6c5ce7;
      --accent-light: #a29bfe;
      --green: #00b894;
      --orange: #fdcb6e;
      --red: #e17055;
      --blue: #74b9ff;
      --radius: 10px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

  body.light-mode {
    --bg: #f5f6fa;
    --surface: #ffffff;
    --surface-hover: #f0f1f5;
    --border: #e2e4ea;
    --text: #1f2937;
    --text-dim: #6b7280;
  }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.6;
      min-height: 100vh;
    }

    .header {
      padding: 28px 32px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header h1 { font-size: 1.5rem; font-weight: 700; }

    .container { max-width: 1400px; margin: 0 auto; padding: 28px 32px; }

    .control-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font-size: 0.9rem;
    }

    .search-box:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      color: #fff;
    }

    .btn-blue { background: var(--blue); color: var(--bg); }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Timeline chart container */
    .chart-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 32px;
      position: relative;
      height: 600px;
    }

    /* Universe cards */
    .universes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .universe-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: all 0.3s;
    }

    .universe-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .universe-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 12px;
    }

    .universe-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .universe-badge {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .completion {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--green);
    }

    .item-count {
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .completion-bar {
      width: 100%;
      height: 6px;
      background: var(--surface-hover);
      border-radius: 3px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .completion-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-light));
      border-radius: 3px;
      transition: width 0.3s;
    }

    .next-recommended {
      font-size: 0.82rem;
      color: var(--text);
      margin-bottom: 12px;
      padding: 6px 10px;
      background: var(--surface-hover);
      border-radius: 6px;
      border-left: 3px solid var(--accent);
    }

    .items-list {
      display: none;
      max-height: 400px;
      overflow-y: auto;
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: 12px;
    }

    .items-list.visible { display: block; }

    .item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 4px;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--border);
      cursor: grab;
      user-select: none;
      transition: background 0.15s;
    }

    .item:active { cursor: grabbing; }
    .item.dragging { opacity: 0.35; }
    .item.drag-over { border-top: 2px solid var(--accent); }

    .item:last-child { border-bottom: none; }

    .item .drag-handle {
      color: var(--text-dim);
      font-size: 0.7rem;
      cursor: grab;
      flex-shrink: 0;
      opacity: 0.5;
    }
    .item:hover .drag-handle { opacity: 1; }

    .universe-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn-send {
      background: var(--green);
      color: #fff;
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-send:hover { opacity: 0.85; }
    .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

    .reorder-hint {
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--green);
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }

    .item-check {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    .item.watched .item-check {
      background: var(--green);
      color: var(--bg);
    }

    .item.unwatched .item-check {
      background: var(--surface-hover);
      border: 1px solid var(--border);
    }

    .item.unavailable .item-check {
      background: var(--red);
      color: #fff;
    }

    .item-title {
      flex: 1;
    }

    .item.unwatched .item-title { color: var(--text-dim); }
    .item.unavailable .item-title { color: var(--red); }

    .item-year {
      font-size: 0.75rem;
      color: var(--text-dim);
      min-width: 40px;
      text-align: right;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .card-actions .expand-btn {
      flex: 1;
      min-width: 0;
      margin-top: 0;
    }

    .card-actions .btn-icon {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      font-size: 0.82rem;
      padding: 8px 12px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .card-actions .btn-icon:hover { border-color: var(--accent); color: var(--accent); }
    .card-actions .btn-delete:hover { border-color: var(--red); color: var(--red); }

    .playlist-toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 0.82rem;
    }
    .playlist-toggle-row input[type="checkbox"] {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .playlist-toggle-row label { color: var(--text-dim); cursor: pointer; }
    .playlist-toggle-row label.active { color: var(--green); }

    .rename-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      font-size: 0.82rem;
    }
    .rename-row input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      padding: 4px 8px;
      font-size: 0.82rem;
    }
    .rename-row input:focus { border-color: var(--accent); outline: none; }
    .rename-row .rename-label { color: var(--text-dim); white-space: nowrap; }

    .desc-row {
      margin-bottom: 12px;
    }
    .desc-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-dim);
      padding: 6px 8px;
      font-size: 0.82rem;
      font-family: inherit;
      resize: vertical;
      min-height: 32px;
      line-height: 1.4;
    }
    .desc-input:focus { border-color: var(--accent); outline: none; color: var(--text); }
    .desc-input::placeholder { color: var(--text-dim); opacity: 0.5; }

    .expand-btn {
      width: 100%;
      padding: 8px;
      background: var(--surface-hover);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 12px;
    }

    .expand-btn:hover {
      background: var(--accent);
      color: #fff;
    }

    .expand-btn.active { background: var(--accent); color: #fff; }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Filter badges */
    .filter-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .filter-badge {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
      background: transparent;
      color: var(--text);
    }

    .filter-badge:hover { border-color: var(--accent); }
    .filter-badge.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Add-item inline form */
    .add-item-form {
      display: none;
      margin-top: 10px;
      padding: 14px;
      background: var(--bg);
      border: 1px solid var(--accent);
      border-radius: 8px;
    }
    .add-item-form.visible { display: block; }
    .add-item-form label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-bottom: 3px;
      margin-top: 10px;
    }
    .add-item-form label:first-child { margin-top: 0; }
    .add-item-form input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--surface);
      color: var(--text);
      font-size: 0.85rem;
    }
    .add-item-form input:focus { outline: none; border-color: var(--accent); }
    .add-item-form .form-row {
      display: flex; gap: 10px;
    }
    .add-item-form .form-row > div { flex: 1; }
    .add-item-btns {
      display: flex; gap: 8px; margin-top: 14px;
    }
  </style>
</head>
<body>
<script>if(localStorage.getItem('suite-theme')==='light')document.body.classList.add('light-mode');</script>
<nav class="suite-nav" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#12141c;border-bottom:1px solid #2a2e42;padding:10px 24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">

  <div class="header">
    <h1>🌌 Shared Universe Discovery</h1>
  </div>

  <div class="container">
    <div class="control-bar">
      <input 
        type="text" 
        class="search-box" 
        id="searchBox" 
        placeholder="Search universes..."
      >
      <button class="btn" id="createBtn" style="background:var(--green);color:#fff;" onclick="toggleCreateUniverse()">
        ➕ Create Universe
      </button>
      <button class="btn btn-blue" id="scanBtn">
        🔄 Scan for Universes
      </button>
      <button class="btn btn-blue" id="refreshBtn">
        ↻ Refresh
      </button>
    </div>

    <!-- Create universe inline form -->
    <div class="add-item-form" id="createUniverseForm">
      <label style="margin-top:0;">Universe Name *</label>
      <input type="text" id="createName" placeholder="e.g. Alien" maxlength="256">
      <label>Description (optional)</label>
      <input type="text" id="createDesc" placeholder="e.g. All films in the Alien franchise">
      <div class="add-item-btns">
        <button class="btn" style="background:var(--green);color:#fff;font-size:0.82rem;padding:8px 16px;" onclick="submitCreateUniverse()">Create</button>
        <button class="btn" style="background:var(--surface);color:var(--text-dim);font-size:0.82rem;padding:8px 16px;" onclick="toggleCreateUniverse()">Cancel</button>
      </div>
    </div>

    <div class="filter-group">
      <button class="filter-badge active" data-filter="all">All (21)</button>
      <button class="filter-badge" data-filter="complete">Complete</button>
      <button class="filter-badge" data-filter="incomplete">Incomplete</button>
      <button class="filter-badge" data-filter="high">High Progress (80%+)</button>
    </div>

    <div class="chart-container">
      <canvas id="timelineChart"></canvas>
    </div>

    <div id="universesList" class="universes-grid">
      <div class="loading">
        <div class="spinner"></div>
        Loading universes...
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let allUniverses = [];
    let currentFilter = 'all';
    let timelineChart = null;

    // Initialize
    async function init() {
      await loadUniverses();
      setupEventListeners();
    }

    async function loadUniverses() {
      try {
        const response = await fetch('/api/universes');
        if (!response.ok) throw new Error('Failed to load universes');
        allUniverses = await response.json();
        renderUniverses();
        renderTimelineChart();
      } catch (error) {
        console.error('Error loading universes:', error);
        document.getElementById('universesList').innerHTML = 
          `<p style="color: var(--red);">Error loading universes: ${error.message}</p>`;
      }
    }

    function setupEventListeners() {
      document.getElementById('searchBox').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        filterAndRenderUniverses(query);
      });

      document.getElementById('scanBtn').addEventListener('click', async () => {
        const btn = document.getElementById('scanBtn');
        btn.disabled = true;
        btn.textContent = '🔄 Scanning...';
        
        try {
          const response = await fetch('/universes/scan', { method: 'POST' });
          if (response.ok) {
            await new Promise(resolve => setTimeout(resolve, 1000)); // Wait for scan
            await loadUniverses();
          }
        } catch (error) {
          console.error('Scan error:', error);
        } finally {
          btn.disabled = false;
          btn.textContent = '🔄 Scan for Universes';
        }
      });

      document.getElementById('refreshBtn').addEventListener('click', loadUniverses);

      // Filter badges
      document.querySelectorAll('.filter-badge').forEach(badge => {
        badge.addEventListener('click', (e) => {
          document.querySelectorAll('.filter-badge').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          currentFilter = e.target.dataset.filter;
          filterAndRenderUniverses();
        });
      });
    }

    function filterAndRenderUniverses(searchQuery = '') {
      let filtered = allUniverses;

      // Apply search filter
      if (searchQuery) {
        filtered = filtered.filter(u => 
          u.name.toLowerCase().includes(searchQuery)
        );
      }

      // Apply status filter
      if (currentFilter === 'complete') {
        filtered = filtered.filter(u => (u.completion_pct ?? 0) === 100);
      } else if (currentFilter === 'incomplete') {
        filtered = filtered.filter(u => (u.completion_pct ?? 0) < 100);
      } else if (currentFilter === 'high') {
        filtered = filtered.filter(u => (u.completion_pct ?? 0) >= 80);
      }

      renderUniverses(filtered);
    }

    function renderUniverses(universes = allUniverses) {
      const container = document.getElementById('universesList');

      if (!universes.length) {
        container.innerHTML = '<p style="color: var(--text-dim);">No universes found</p>';
        return;
      }

      container.innerHTML = universes.map(universe => {
        const percentage = Math.round(universe.completion_pct ?? 0);
        const hasItems = (universe.items || []).length > 0;
        const next = universe.next_recommended;
        const nextHtml = next
          ? `<div class="next-recommended">▶ Next: <strong>${escapeHtml(next.title)}</strong>${next.year ? ` (${next.year})` : ''}${!next.emby_item_id ? ' <span style="color:var(--text-dim);">(not in library)</span>' : ''}</div>`
          : (percentage >= 100 && (universe.items || []).length ? `<div class="next-recommended" style="color:var(--text-dim);">✓ Universe complete</div>` : '');
        return `
          <div class="universe-card" data-universe-id="${universe.id}">
            <div class="universe-header">
              <div class="universe-title">${escapeHtml(universe.custom_name || universe.name)}</div>
              <div class="universe-badge">
                <div class="completion">${percentage}%</div>
                <div class="item-count">${universe.watched ?? 0}✓ watched · ${universe.in_library ?? 0}/${universe.total_items ?? 0} in library</div>
              </div>
            </div>

            <div class="completion-bar">
              <div class="completion-bar-fill" style="width: ${percentage}%"></div>
            </div>
            ${nextHtml}

            <div class="card-actions">
              ${hasItems ? `<button class="expand-btn" data-universe-id="${universe.id}" onclick="toggleExpand(this, ${universe.id})">▶ Show Details</button>` : `<span style="flex:1;color:var(--text-dim);font-size:0.82rem;">No items yet — add some below</span>`}
              <button class="btn-icon" onclick="toggleAddItem(${universe.id})" title="Add item">➕ Add Item</button>
              <button class="btn-icon btn-delete" onclick="deleteUniverse(${universe.id}, '${escapeHtml(universe.name).replace(/'/g, "\\'")}')" title="Delete universe">🗑️</button>
            </div>

            <div class="rename-row">
              <span class="rename-label">Name:</span>
              <input type="text" id="renameInput-${universe.id}"
                value="${escapeHtml(universe.custom_name || universe.name)}"
                placeholder="${escapeHtml(universe.name)}"
                onblur="saveRename(${universe.id})"
                onkeydown="if(event.key==='Enter')this.blur()" />
            </div>

            <div class="playlist-toggle-row">
              <input type="checkbox" id="plToggle-${universe.id}" ${universe.playlist_enabled ? 'checked' : ''}
                onchange="updateUniverseSettings(${universe.id}, {playlist_enabled: this.checked})" />
              <label for="plToggle-${universe.id}" class="${universe.playlist_enabled ? 'active' : ''}">Sync to Emby Playlist</label>
            </div>

            <div class="desc-row">
              <textarea class="desc-input" id="descInput-${universe.id}"
                placeholder="Add a description…"
                onblur="saveDescription(${universe.id})"
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();this.blur();}"
                rows="2">${escapeHtml(universe.description || '')}</textarea>
            </div>

            <div class="items-list" id="items-${universe.id}">
              ${generateItemsList(universe.items || [], universe.id)}
            </div>

            <div class="add-item-form" id="addItemForm-${universe.id}">
              <label style="margin-top:0;">Title *</label>
              <input type="text" id="addTitle-${universe.id}" placeholder="e.g. Deadpool & Wolverine" />
              <div class="form-row">
                <div>
                  <label>Year</label>
                  <input type="number" id="addYear-${universe.id}" placeholder="2024" min="1900" max="2099" />
                </div>
                <div>
                  <label>IMDB ID</label>
                  <input type="text" id="addImdb-${universe.id}" placeholder="tt1234567" />
                </div>
                <div>
                  <label>TMDB ID</label>
                  <input type="number" id="addTmdb-${universe.id}" placeholder="533535" />
                </div>
              </div>
              <div class="add-item-btns">
                <button class="btn-send" onclick="submitAddItem(${universe.id})">Add to Universe</button>
                <button class="btn-send" style="background:var(--surface-hover);color:var(--text);border:1px solid var(--border);" onclick="toggleAddItem(${universe.id})">Cancel</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function generateItemsList(items, universeId) {
      if (!items || !items.length) return '<p style="color: var(--text-dim);">No items</p>';

      const libraryItems = items.filter(i => i.in_library);
      const missingItems = items.filter(i => !i.in_library);
      const hasLibraryItems = libraryItems.length > 0;

      let html = items.map((item, idx) => {
        const status = item.watched ? 'watched' : item.in_library ? 'unwatched' : 'unavailable';
        const statusIcon = status === 'watched' ? '✓' : '○';
        const statusText = status === 'watched' ? 'Watched' : status === 'unwatched' ? 'Unwatched' : 'Unavailable';

        // Missing items get a checkbox for Radarr
        const radarrCheck = !item.in_library
          ? `<input type="checkbox" class="radarr-check" data-tmdb="${item.tmdb_id || ''}" data-imdb="${item.imdb_id || ''}" data-title="${escapeHtml(item.title)}" data-year="${item.year || ''}" style="accent-color:var(--orange);margin-right:4px;" />`
          : '';

        return `
          <div class="item ${status}" draggable="true" data-idx="${idx}" data-item-id="${item.id}" data-emby-id="${item.emby_item_id || ''}" data-universe-id="${universeId}">
            <span class="drag-handle">☰</span>
            ${radarrCheck}
            <div class="item-check" title="${statusText}">${statusIcon}</div>
            <div class="item-title">${escapeHtml(item.title)}</div>
            <div class="item-year">${item.year ?? ""}</div>
            <button onclick="removeItem(${universeId}, ${item.id}, '${escapeHtml(item.title).replace(/'/g, "\\'")}')" title="Remove from universe" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:0.75rem;padding:2px 4px;opacity:0.4;transition:opacity 0.15s;" onmouseover="this.style.opacity='1';this.style.color='var(--red)'" onmouseout="this.style.opacity='0.4';this.style.color='var(--text-dim)'">✕</button>
          </div>
        `;
      }).join('');

      // Actions row
      html += '<div class="universe-actions">';

      if (hasLibraryItems) {
        html += `<button class="btn-send" onclick="sendToEmby(${universeId})">📤 Send to Emby</button>`;
        html += `<span class="reorder-hint">Drag items to reorder, then send to Emby as a playlist</span>`;
      }

      if (missingItems.length > 0) {
        html += `
          <button class="btn-send" style="background:var(--orange);color:var(--bg);" onclick="sendToRadarr(${universeId})">📥 Send to Radarr</button>
          <button class="btn-send" style="background:var(--surface-hover);color:var(--text);border:1px solid var(--border);font-size:0.75rem;" onclick="toggleMissingChecks(${universeId})">Select All Missing</button>
        `;
      }

      html += `<button class="btn-send" style="background:var(--accent);color:#fff;" onclick="toggleAddItem(${universeId})">➕ Add Item</button>`;

      html += '</div>';

      // Radarr server selector (hidden until needed)
      if (missingItems.length > 0) {
        html += `<div class="radarr-bar" id="radarrBar-${universeId}" style="display:none;margin-top:8px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:0.82rem;"></div>`;
      }

      return html;
    }

    // --- Drag and drop reorder ---
    let dragItem = null;

    document.addEventListener('dragstart', (e) => {
      const item = e.target.closest('.item[draggable]');
      if (!item) return;
      dragItem = item;
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });

    document.addEventListener('dragend', (e) => {
      if (dragItem) dragItem.classList.remove('dragging');
      document.querySelectorAll('.item.drag-over').forEach(el => el.classList.remove('drag-over'));
      dragItem = null;
    });

    document.addEventListener('dragover', (e) => {
      e.preventDefault();
      const target = e.target.closest('.item[draggable]');
      if (!target || target === dragItem) return;
      // Only allow reorder within the same universe
      if (target.dataset.universeId !== dragItem.dataset.universeId) return;
      e.dataTransfer.dropEffect = 'move';
      document.querySelectorAll('.item.drag-over').forEach(el => el.classList.remove('drag-over'));
      target.classList.add('drag-over');
    });

    document.addEventListener('drop', (e) => {
      e.preventDefault();
      const target = e.target.closest('.item[draggable]');
      if (!target || !dragItem || target === dragItem) return;
      if (target.dataset.universeId !== dragItem.dataset.universeId) return;

      const container = target.parentNode;
      const allItems = [...container.querySelectorAll('.item[draggable]')];
      const fromIdx = allItems.indexOf(dragItem);
      const toIdx = allItems.indexOf(target);

      if (fromIdx < toIdx) {
        target.after(dragItem);
      } else {
        target.before(dragItem);
      }

      target.classList.remove('drag-over');
    });

    // --- Send to Emby ---
    async function sendToEmby(universeId) {
      const container = document.getElementById(`items-${universeId}`);
      if (!container) return;

      const items = [...container.querySelectorAll('.item[draggable]')];
      // Send DB item IDs so the backend can persist the order
      const itemIds = items
        .map(el => parseInt(el.dataset.itemId))
        .filter(id => !isNaN(id));

      if (!itemIds.length) {
        showToast('No items to reorder');
        return;
      }

      const btn = container.querySelector('.btn-send');
      if (btn) { btn.disabled = true; btn.textContent = '📤 Saving...'; }

      try {
        const resp = await fetch(`/api/universes/${universeId}/reorder`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ item_ids: itemIds }),
        });
        const data = await resp.json();
        if (data.status === 'ok') {
          showToast(`✓ Order saved & playlist created (${data.items} items)`);
        } else {
          showToast('Error: ' + (data.reason || 'unknown'));
        }
      } catch (err) {
        showToast('Error: ' + err.message);
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = '📤 Send to Emby'; }
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function toggleExpand(btn, universeId) {
      const itemsList = document.getElementById(`items-${universeId}`);
      const isExpanding = !itemsList.classList.contains('visible');

      itemsList.classList.toggle('visible');
      btn.classList.toggle('active');
      btn.textContent = isExpanding ? '▼ Hide Details' : '▶ Show Details';
    }

    function renderTimelineChart() {
      const ctx = document.getElementById('timelineChart').getContext('2d');

      // Prepare data for horizontal bar chart (top 15 by completion)
      const sorted = [...allUniverses].sort((a, b) => (b.completion_pct ?? 0) - (a.completion_pct ?? 0)).slice(0, 15);
      const labels = sorted.map(u => u.name);
      const data = sorted.map(u => u.completion_pct ?? 0);
      const backgroundColor = data.map(d => {
        if (d === 100) return '#00b894'; // Green for complete
        if (d >= 80) return '#fdcb6e';   // Orange for high progress
        if (d > 0) return '#6c5ce7';     // Purple for partial
        return '#2a2e3e';                // Gray for not started
      });

      // Destroy any chart bound to this canvas (guards against half-initialized state)
      const existing = Chart.getChart(ctx.canvas);
      if (existing) existing.destroy();
      timelineChart = null;

      timelineChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Completion %',
            data: data,
            backgroundColor: backgroundColor,
            borderRadius: 6,
            borderSkipped: false,
            minBarLength: 4,
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#1a1d27',
              titleColor: '#e0e0e6',
              bodyColor: '#8b8fa3',
              borderColor: '#2a2e3e',
              borderWidth: 1,
              padding: 12,
              cornerRadius: 6,
              displayColors: false,
              callbacks: {
                label: (context) => `${Math.round(context.parsed.x)}% Complete`
              }
            }
          },
          scales: {
            x: {
              max: 100,
              ticks: { color: '#8b8fa3' },
              grid: { color: '#2a2e3e', drawBorder: false },
              title: { display: true, text: 'Completion %', color: '#e0e0e6' }
            },
            y: {
              ticks: { color: '#8b8fa3' },
              grid: { drawTicks: false, display: false }
            }
          }
        }
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // --- Radarr integration ---
    let radarrServers = [];

    async function loadRadarrServers() {
      try {
        const r = await fetch('/api/radarr/servers');
        const d = await r.json();
        radarrServers = d.servers || [];
      } catch(e) {}
    }

    function toggleMissingChecks(universeId) {
      const container = document.getElementById(`items-${universeId}`);
      if (!container) return;
      const checks = container.querySelectorAll('.radarr-check');
      const allChecked = Array.from(checks).every(c => c.checked);
      checks.forEach(c => c.checked = !allChecked);
    }

    async function sendToRadarr(universeId) {
      const container = document.getElementById(`items-${universeId}`);
      if (!container) return;

      const checked = container.querySelectorAll('.radarr-check:checked');
      if (!checked.length) {
        showToast('Select missing items to send to Radarr');
        return;
      }

      // Build movie list
      const movies = Array.from(checked).map(cb => ({
        tmdb_id: cb.dataset.tmdb ? parseInt(cb.dataset.tmdb) : null,
        imdb_id: cb.dataset.imdb || null,
        title: cb.dataset.title || '',
        year: cb.dataset.year ? parseInt(cb.dataset.year) : null,
      }));

      // Load servers if not cached
      if (!radarrServers.length) await loadRadarrServers();
      if (!radarrServers.length) {
        showToast('No Radarr servers configured — add one in Settings');
        return;
      }

      // If 1 server, send directly. If 2, show picker.
      if (radarrServers.length === 1) {
        await doSendToRadarr(movies, 0, universeId);
      } else {
        const bar = document.getElementById(`radarrBar-${universeId}`);
        bar.style.display = 'flex';
        bar.style.alignItems = 'center';
        bar.style.gap = '8px';
        bar.innerHTML = `
          <span>Send ${movies.length} item${movies.length > 1 ? 's' : ''} to:</span>
          <select id="radarrSelect-${universeId}" style="padding:6px 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text);font-size:0.82rem;">
            ${radarrServers.map((s, i) => `<option value="${i}">${escapeHtml(s.name)}</option>`).join('')}
          </select>
          <button class="btn-send" style="background:var(--orange);color:var(--bg);padding:6px 12px;font-size:0.78rem;" onclick="doSendFromPicker(${universeId})">📥 Send</button>
          <button style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:0.82rem;" onclick="document.getElementById('radarrBar-${universeId}').style.display='none'">Cancel</button>
        `;
      }
    }

    async function doSendFromPicker(universeId) {
      const container = document.getElementById(`items-${universeId}`);
      const checked = container.querySelectorAll('.radarr-check:checked');
      const movies = Array.from(checked).map(cb => ({
        tmdb_id: cb.dataset.tmdb ? parseInt(cb.dataset.tmdb) : null,
        imdb_id: cb.dataset.imdb || null,
        title: cb.dataset.title || '',
        year: cb.dataset.year ? parseInt(cb.dataset.year) : null,
      }));
      const sel = document.getElementById(`radarrSelect-${universeId}`);
      const idx = parseInt(sel.value);
      document.getElementById(`radarrBar-${universeId}`).style.display = 'none';
      await doSendToRadarr(movies, idx, universeId);
    }

    async function doSendToRadarr(movies, serverIndex, universeId) {
      showToast(`Sending ${movies.length} item${movies.length > 1 ? 's' : ''} to ${radarrServers[serverIndex]?.name || 'Radarr'}…`);
      try {
        const r = await fetch('/api/radarr/add', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({server_index: serverIndex, movies}),
        });
        const d = await r.json();
        if (d.status === 'ok') {
          showToast(`✓ ${d.added}/${d.total} added to ${d.server}`);
          // Uncheck sent items
          const container = document.getElementById(`items-${universeId}`);
          if (container) container.querySelectorAll('.radarr-check:checked').forEach(c => c.checked = false);
        } else {
          showToast('Error: ' + (d.detail || d.reason || 'Unknown'));
        }
      } catch(e) {
        showToast('Error: ' + e.message);
      }
    }

    // Load on page load
    init();
    loadRadarrServers();

    // --- Add item to universe ---
    function toggleAddItem(universeId) {
      const form = document.getElementById(`addItemForm-${universeId}`);
      form.classList.toggle('visible');
      if (form.classList.contains('visible')) {
        document.getElementById(`addTitle-${universeId}`).focus();
      }
    }

    async function submitAddItem(universeId) {
      const title = document.getElementById(`addTitle-${universeId}`).value.trim();
      const year = document.getElementById(`addYear-${universeId}`).value.trim();
      const imdb = document.getElementById(`addImdb-${universeId}`).value.trim();
      const tmdb = document.getElementById(`addTmdb-${universeId}`).value.trim();

      if (!title) {
        showToast('Title is required');
        return;
      }

      try {
        const resp = await fetch(`/api/universes/${universeId}/items`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            title,
            year: year ? parseInt(year) : null,
            imdb_id: imdb || null,
            tmdb_id: tmdb || null,
            item_type: 'movie',
          }),
        });
        const data = await resp.json();
        if (data.status === 'ok') {
          showToast(`✓ Added "${data.title}" — matching library…`);
          // Clear form
          document.getElementById(`addTitle-${universeId}`).value = '';
          document.getElementById(`addYear-${universeId}`).value = '';
          document.getElementById(`addImdb-${universeId}`).value = '';
          document.getElementById(`addTmdb-${universeId}`).value = '';
          toggleAddItem(universeId);
          // Reload after brief delay for scan to start
          setTimeout(() => loadUniverses(), 3000);
        } else {
          showToast('Error: ' + (data.reason || 'unknown'));
        }
      } catch (err) {
        showToast('Error: ' + err.message);
      }
    }

    // --- Delete entire universe ---
    async function deleteUniverse(universeId, name) {
      if (!confirm(`Delete the entire "${name}" universe and all its items?\n\nThis cannot be undone.`)) return;
      try {
        const resp = await fetch(`/api/universes/${universeId}`, {method: 'DELETE'});
        const data = await resp.json();
        if (data.status === 'ok') {
          showToast(`✓ Deleted "${data.removed}"`);
          await loadUniverses();
        } else {
          showToast('Error: ' + (data.reason || 'unknown'));
        }
      } catch (err) {
        showToast('Error: ' + err.message);
      }
    }

    // --- Create new universe ---
    function toggleCreateUniverse() {
      const form = document.getElementById('createUniverseForm');
      form.classList.toggle('visible');
      if (form.classList.contains('visible')) {
        document.getElementById('createName').focus();
      }
    }

    async function submitCreateUniverse() {
      const name = document.getElementById('createName').value.trim();
      const desc = document.getElementById('createDesc').value.trim();
      if (!name) {
        showToast('Name is required');
        return;
      }
      try {
        const resp = await fetch('/api/universes', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({name, description: desc || null}),
        });
        const data = await resp.json();
        if (data.status === 'ok') {
          showToast(`✓ Created "${data.name}" — add items to build it out`);
          document.getElementById('createName').value = '';
          document.getElementById('createDesc').value = '';
          toggleCreateUniverse();
          await loadUniverses();
        } else {
          const reasons = {name_required: 'Name is required', universe_already_exists: 'A universe with that name already exists', invalid_name: 'Name must contain at least one alphanumeric character'};
          showToast('Error: ' + (reasons[data.reason] || data.reason || 'unknown'));
        }
      } catch (err) {
        showToast('Error: ' + err.message);
      }
    }

    async function removeItem(universeId, itemId, title) {
      if (!confirm(`Remove "${title}" from this universe?`)) return;
      try {
        const resp = await fetch(`/api/universes/${universeId}/items/${itemId}`, {method: 'DELETE'});
        const data = await resp.json();
        if (data.status === 'ok') {
          showToast(`✓ Removed "${data.removed}"`);
          await loadUniverses();
        } else {
          showToast('Error: ' + (data.reason || 'unknown'));
        }
      } catch (err) {
        showToast('Error: ' + err.message);
      }
    }

    // --- Universe playlist settings ---
    async function updateUniverseSettings(universeId, settings) {
      try {
        const resp = await fetch(`/api/universes/${universeId}/settings`, {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(settings),
        });
        const data = await resp.json();
        if (data.status === 'ok') {
          // Update label styling
          const label = document.querySelector(`label[for="plToggle-${universeId}"]`);
          if (label) label.className = data.playlist_enabled ? 'active' : '';
          const action = data.playlist_enabled ? 'enabled' : 'disabled';
          showToast(`✓ Playlist ${action}`);
        }
      } catch (err) {
        showToast('Error: ' + err.message);
      }
    }

    async function saveRename(universeId) {
      const input = document.getElementById(`renameInput-${universeId}`);
      if (!input) return;
      const val = input.value.trim();
      if (!val) return;  // don't save blank
      try {
        const resp = await fetch(`/api/universes/${universeId}/settings`, {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({custom_name: val}),
        });
        const data = await resp.json();
        if (data.status === 'ok') {
          // Update card title
          const card = document.querySelector(`.universe-card[data-universe-id="${universeId}"]`);
          if (card) {
            const titleEl = card.querySelector('.universe-title');
            if (titleEl) titleEl.textContent = val;
          }
          showToast('✓ Name saved');
        }
      } catch (err) {
        showToast('Error: ' + err.message);
      }
    }

    async function saveDescription(universeId) {
      const input = document.getElementById(`descInput-${universeId}`);
      if (!input) return;
      const val = input.value.trim();
      try {
        const resp = await fetch(`/api/universes/${universeId}/settings`, {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({description: val || null}),
        });
        const data = await resp.json();
        if (data.status === 'ok') {
          showToast('✓ Description saved');
        }
      } catch (err) {
        showToast('Error: ' + err.message);
      }
    }
  </script>
</body>
</html>
