<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filmography Tracker — Emby-Simkl Suite</title>
<style>
  :root {
    --bg: #0D0F14;
    --surface: #151820;
    --surface-hover: #1C2030;
    --border: #222838;
    --text: #E6EDF3;
    --text-dim: #7D8590;
    --accent: #7B68EE;
    --accent-light: #9585F0;
    --green: #4AAD6E;
    --orange: #D29922;
    --red: #E05252;
    --blue: #7B8CDE;
    --radius: 10px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
  .container { max-width: 1100px; margin: 0 auto; padding: 28px 20px; }
  h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 20px; }
  .search-row { display: flex; gap: 10px; margin-bottom: 24px; }
  .search-row input {
    flex: 1; padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 0.95rem; outline: none;
  }
  .search-row input:focus { border-color: var(--accent); }
  .btn { padding: 10px 20px; border: none; border-radius: var(--radius); cursor: pointer; font-weight: 600; font-size: 0.88rem; }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-accent:hover { opacity: 0.9; }
  .person-header {
    display: flex; align-items: center; gap: 16px; padding: 16px; background: var(--surface);
    border-radius: var(--radius); margin-bottom: 20px; border: 1px solid var(--border);
  }
  .person-photo { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: var(--surface-hover); }
  .person-name { font-size: 1.2rem; font-weight: 700; }
  .person-dept { color: var(--text-dim); font-size: 0.85rem; }
  .stats-row { display: flex; gap: 12px; margin-bottom: 20px; }
  .stat-card {
    padding: 12px 16px; background: var(--surface); border-radius: var(--radius);
    border: 1px solid var(--border); flex: 1; text-align: center;
  }
  .stat-val { font-size: 1.4rem; font-weight: 700; }
  .stat-val.accent { color: var(--accent); }
  .stat-val.green { color: var(--green); }
  .stat-val.blue { color: var(--blue); }
  .stat-label { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-btn {
    padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: transparent; color: var(--text-dim); cursor: pointer; font-size: 0.82rem;
  }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .works-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .work-card {
    background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border);
    overflow: hidden; cursor: pointer; transition: border-color 0.2s;
  }
  .work-card:hover { border-color: var(--accent); }
  .work-poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: var(--surface-hover); display: block; }
  .work-info { padding: 8px 10px; }
  .work-title { font-size: 0.82rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .work-year { font-size: 0.72rem; color: var(--text-dim); }
  .work-role { font-size: 0.7rem; color: var(--accent-light); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge-library { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: 600; background: rgba(74,173,110,0.15); color: var(--green); }
  .badge-missing { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: 600; background: rgba(125,133,144,0.15); color: var(--text-dim); }
  .badge-watched { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: 600; background: rgba(123,140,222,0.15); color: var(--blue); margin-left: 3px; }
  .badge-watchlist { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: 600; background: rgba(210,153,34,0.15); color: var(--orange); margin-left: 3px; }
  .badge-radarr, .badge-sonarr { display: inline-block; padding: 1px 5px; border-radius: 4px; font-size: 0.7rem; cursor: pointer; background: rgba(107,93,199,0.2); margin-left: 4px; transition: background 0.2s; }
  .badge-radarr:hover, .badge-sonarr:hover { background: rgba(107,93,199,0.4); }
  .loading { text-align: center; color: var(--text-dim); padding: 40px; }
  .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; color: var(--text-dim); padding: 40px; font-size: 0.95rem; }
  .progress-bar { height: 6px; background: var(--surface-hover); border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--blue)); border-radius: 3px; transition: width 0.3s; }
  a { color: inherit; text-decoration: none; }
</style>
<script src="/static/js/csrf.js"></script>
</head>
<body>
<nav class="suite-nav" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#0D0F14;border-bottom:1px solid #222838;padding:10px 24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <span style="color:#7D8590;font-size:0.85rem;font-weight:700;letter-spacing:0.5px;margin-right:10px;">EMBY-SIMKL SUITE</span>
    <a href="/" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">Dashboard</a>
    <a href="/lists" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">📋 Lists</a>
    <a href="/predictions" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">🤖 Predictions</a>
    <a href="/bias" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">🎓 Taste Profile</a>
    <a href="/rewatch" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">🔁 Rewatch</a>
    <a href="/stats" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">📊 Stats</a>
    <a href="/watch-history" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">📜 History</a>
    <a href="/library-health" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">🏥 Health</a>
    <a href="/watch-party" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">👥 Watch Party</a>
    <a href="/filmography" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:#1C2030;color:#ffffff;font-weight:600;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='#1C2030'">🎬 Filmography</a>
    <a href="/duplicates" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">🔍 Duplicates</a>
    <a href="/settings" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">⚙️ Settings</a>
    <a href="/guide" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">📖 Guide</a>
</nav>
<div class="container">
  <h1>🎬 Filmography Tracker</h1>
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="Search for an actor or director…" onkeydown="if(event.key==='Enter')doSearch()" />
    <button class="btn btn-accent" onclick="doSearch()">Search</button>
  </div>
  <div id="suggestions"></div>
  <div id="results"></div>
</div>

<!-- Radarr server picker modal -->
<div id="radarrModal" style="display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.7);align-items:center;justify-content:center;">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;max-width:360px;width:90%;">
    <div style="font-weight:700;margin-bottom:14px;">Send to Radarr</div>
    <div id="radarrModalBody"></div>
    <div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end;">
      <button class="btn" style="background:var(--surface-hover);color:var(--text);" onclick="closeRadarrModal()">Cancel</button>
      <button class="btn btn-accent" id="radarrConfirmBtn" onclick="confirmRadarrSend()">Send</button>
    </div>
  </div>
</div>

<!-- Sonarr server picker modal -->
<div id="sonarrModal" style="display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.7);align-items:center;justify-content:center;">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;max-width:360px;width:90%;">
    <div style="font-weight:700;margin-bottom:14px;">Send to Sonarr</div>
    <div id="sonarrModalBody"></div>
    <div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end;">
      <button class="btn" style="background:var(--surface-hover);color:var(--text);" onclick="closeSonarrModal()">Cancel</button>
      <button class="btn btn-accent" onclick="confirmSonarrSend()">Send</button>
    </div>
  </div>
</div>

<script>
const TMDB_IMG = '/api/tmdb/image/';
var allWorks = [];
var activeFilter = 'all';
var radarrServers = [];
var sonarrServers = [];
var pendingRadarrItem = null;
var pendingSonarrItem = null;

/* --- Suggestions --- */
async function loadSuggestions() {
  try {
    var r = await fetch('/api/filmography/popular');
    if (!r.ok) return;
    var data = await r.json();
    var people = data.people || [];
    if (!people.length) return;
    var html = '<div style="margin-bottom:20px;"><div style="color:var(--text-dim);font-size:0.78rem;font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;">Popular right now</div>';
    html += '<div style="display:flex;gap:10px;flex-wrap:wrap;">';
    people.forEach(function(p) {
      var photoUrl = p.profile_path ? TMDB_IMG + 'w185' + p.profile_path : '';
      var subtitle = (p.known_for || []).join(', ');
      html += '<div class="suggest-chip" onclick="searchPerson(\'' + esc(p.name).replace(/'/g, "\\'") + '\')" style="display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;background:var(--surface);border:1px solid var(--border);border-radius:20px;cursor:pointer;transition:border-color 0.2s;" onmouseover="this.style.borderColor=\'var(--accent)\'" onmouseout="this.style.borderColor=\'var(--border)\'">';
      if (photoUrl) html += '<img src="' + photoUrl + '" style="width:28px;height:28px;border-radius:50%;object-fit:cover;" />';
      else html += '<div style="width:28px;height:28px;border-radius:50%;background:var(--surface-hover);"></div>';
      html += '<div><div style="font-size:0.82rem;font-weight:600;">' + esc(p.name) + '</div>';
      if (subtitle) html += '<div style="font-size:0.68rem;color:var(--text-dim);max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + esc(subtitle) + '</div>';
      html += '</div></div>';
    });
    html += '</div></div>';
    document.getElementById('suggestions').innerHTML = html;
  } catch(e) { /* silent */ }
}

function searchPerson(name) {
  document.getElementById('searchInput').value = name;
  doSearch();
}

/* --- Radarr --- */
async function loadRadarrServers() {
  try {
    var r = await fetch('/api/radarr/servers');
    if (r.ok) { var d = await r.json(); radarrServers = d.servers || d || []; }
  } catch(e) { /* silent */ }
}

function sendToRadarr(tmdb_id, title, year, evt) {
  if (evt) { evt.preventDefault(); evt.stopPropagation(); }
  pendingRadarrItem = { tmdb_id: tmdb_id, title: title, year: year };
  if (radarrServers.length === 0) {
    alert('No Radarr servers configured — add one in Settings.');
    return;
  }
  if (radarrServers.length === 1) {
    doRadarrSend(0);
    return;
  }
  /* Show picker */
  var html = '<div style="font-size:0.88rem;margin-bottom:10px;">Choose server for <strong>' + esc(title) + '</strong>:</div>';
  radarrServers.forEach(function(srv, i) {
    html += '<label style="display:block;padding:8px 10px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;cursor:pointer;font-size:0.88rem;">';
    html += '<input type="radio" name="radarr_srv" value="' + i + '"' + (i === 0 ? ' checked' : '') + ' style="margin-right:8px;" />';
    html += esc(srv.name || ('Server ' + (i + 1)));
    html += '</label>';
  });
  document.getElementById('radarrModalBody').innerHTML = html;
  document.getElementById('radarrModal').style.display = 'flex';
}

function closeRadarrModal() { document.getElementById('radarrModal').style.display = 'none'; pendingRadarrItem = null; }

function confirmRadarrSend() {
  var sel = document.querySelector('input[name="radarr_srv"]:checked');
  var idx = sel ? parseInt(sel.value) : 0;
  closeRadarrModal();
  doRadarrSend(idx);
}

async function doRadarrSend(serverIndex) {
  if (!pendingRadarrItem) return;
  var item = pendingRadarrItem;
  pendingRadarrItem = null;
  try {
    var r = await fetch('/api/radarr/add', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        server_index: serverIndex,
        movies: [{ tmdb_id: item.tmdb_id, title: item.title, year: item.year ? parseInt(item.year) : null }],
      }),
    });
    var d = await r.json();
    if (d.added > 0) {
      showToast('Added "' + item.title + '" to Radarr', 'green');
    } else {
      var msg = (d.results && d.results[0] && d.results[0].message) || 'Already exists or failed';
      showToast(msg, 'orange');
    }
  } catch(e) {
    showToast('Radarr error: ' + e.message, 'red');
  }
}

/* --- Sonarr --- */
async function loadSonarrServers() {
  try {
    var r = await fetch('/api/sonarr/servers');
    if (r.ok) { var d = await r.json(); sonarrServers = d.servers || d || []; }
  } catch(e) { /* silent */ }
}

function sendToSonarr(tvdb_id, imdb_id, title, year, tmdb_id, evt) {
  if (evt) { evt.preventDefault(); evt.stopPropagation(); }
  /* tmdb_id is the fallback: shows not in the library have no tvdb_id,
     so the backend resolves TMDB -> TVDB before hitting Sonarr */
  pendingSonarrItem = { tvdb_id: tvdb_id, imdb_id: imdb_id, title: title, year: year, tmdb_id: tmdb_id };
  if (sonarrServers.length === 0) {
    alert('No Sonarr servers configured — add one in Settings.');
    return;
  }
  if (sonarrServers.length === 1) {
    doSonarrSend(0);
    return;
  }
  var html = '<div style="font-size:0.88rem;margin-bottom:10px;">Choose server for <strong>' + esc(title) + '</strong>:</div>';
  sonarrServers.forEach(function(srv, i) {
    html += '<label style="display:block;padding:8px 10px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;cursor:pointer;font-size:0.88rem;">';
    html += '<input type="radio" name="sonarr_srv" value="' + i + '"' + (i === 0 ? ' checked' : '') + ' style="margin-right:8px;" />';
    html += esc(srv.name || ('Server ' + (i + 1)));
    html += '</label>';
  });
  document.getElementById('sonarrModalBody').innerHTML = html;
  document.getElementById('sonarrModal').style.display = 'flex';
}

function closeSonarrModal() { document.getElementById('sonarrModal').style.display = 'none'; pendingSonarrItem = null; }

function confirmSonarrSend() {
  var sel = document.querySelector('input[name="sonarr_srv"]:checked');
  var idx = sel ? parseInt(sel.value) : 0;
  closeSonarrModal();
  doSonarrSend(idx);
}

async function doSonarrSend(serverIndex) {
  if (!pendingSonarrItem) return;
  var item = pendingSonarrItem;
  pendingSonarrItem = null;
  try {
    var r = await fetch('/api/sonarr/add', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        server_index: serverIndex,
        shows: [{
          tvdb_id: item.tvdb_id ? parseInt(item.tvdb_id) : null,
          tmdb_id: item.tmdb_id ? parseInt(item.tmdb_id) : null,
          imdb_id: item.imdb_id || null,
          title: item.title,
          year: item.year ? parseInt(item.year) : null,
        }],
      }),
    });
    var d = await r.json();
    var res = (d.results && d.results[0]) || {};
    if (d.added > 0) {
      /* Warn when Sonarr matched on title alone — no TVDB ID was
         available, so the series it picked may not be the right one */
      if (res.matched_by === 'title') {
        showToast('Added "' + (res.title || item.title) + '" — matched by title, please verify in Sonarr', 'orange');
      } else {
        showToast('Added "' + (res.title || item.title) + '" to Sonarr', 'green');
      }
    } else {
      var msg = res.reason || res.message || 'Already exists or failed';
      showToast(msg, 'orange');
    }
  } catch(e) {
    showToast('Sonarr error: ' + e.message, 'red');
  }
}

function showToast(msg, color) {
  var t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:' + (color === 'green' ? 'var(--green)' : color === 'red' ? 'var(--red)' : 'var(--orange)') + ';color:#fff;padding:10px 20px;border-radius:8px;font-size:0.88rem;z-index:200;opacity:0;transition:opacity 0.3s;';
  document.body.appendChild(t);
  requestAnimationFrame(function() { t.style.opacity = '1'; });
  setTimeout(function() { t.style.opacity = '0'; setTimeout(function() { t.remove(); }, 300); }, 3000);
}

/* --- Search + render --- */
async function doSearch() {
  var q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  document.getElementById('suggestions').innerHTML = '';
  var el = document.getElementById('results');
  el.innerHTML = '<div class="loading"><div class="spinner"></div> Searching…</div>';
  try {
    var r = await fetch('/api/filmography/' + encodeURIComponent(q));
    if (!r.ok) { el.innerHTML = '<div class="empty">No results found for "' + q + '"</div>'; return; }
    var data = await r.json();
    renderResults(data);
    // Push state so browser back returns to the suggestions view
    history.pushState({ person: q }, '', '/filmography?q=' + encodeURIComponent(q));
  } catch(e) {
    el.innerHTML = '<div class="empty">Error: ' + e.message + '</div>';
  }
}

function renderResults(data) {
  var p = data.person;
  allWorks = data.works;
  var pct = data.total > 0 ? Math.round(data.in_library / data.total * 100) : 0;

  var photoUrl = p.profile_path ? TMDB_IMG + 'w185' + p.profile_path : '';
  var html = '<div class="person-header">';
  if (photoUrl) html += '<img class="person-photo" src="' + photoUrl + '" alt="" />';
  html += '<div><div class="person-name">' + esc(p.name) + '</div>';
  html += '<div class="person-dept">' + esc(p.known_for || '') + '</div></div></div>';

  var watchedCount = data.watched || 0;
  var watchlistedCount = (data.works || []).filter(function(w) { return w.on_watchlist; }).length;
  html += '<div class="stats-row">';
  html += '<div class="stat-card"><div class="stat-val accent">' + data.total + '</div><div class="stat-label">Total Works</div></div>';
  html += '<div class="stat-card"><div class="stat-val green">' + data.in_library + '</div><div class="stat-label">In Library</div></div>';
  html += '<div class="stat-card"><div class="stat-val blue">' + watchedCount + '</div><div class="stat-label">Watched</div></div>';
  if (watchlistedCount > 0) html += '<div class="stat-card"><div class="stat-val" style="color:var(--orange);">' + watchlistedCount + '</div><div class="stat-label">Watchlisted</div></div>';
  html += '<div class="stat-card"><div class="stat-val" style="color:var(--accent-light);">' + pct + '%</div><div class="stat-label">Coverage</div></div>';
  html += '</div>';

  html += '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%;"></div></div>';

  html += '<div class="filter-row">';
  html += '<button class="filter-btn active" onclick="setFilter(this,\'all\')">All</button>';
  html += '<button class="filter-btn" onclick="setFilter(this,\'movie\')">Movies</button>';
  html += '<button class="filter-btn" onclick="setFilter(this,\'tv\')">TV Shows</button>';
  html += '<button class="filter-btn" onclick="setFilter(this,\'in_library\')">In Library</button>';
  html += '<button class="filter-btn" onclick="setFilter(this,\'missing\')">Not in Library</button>';
  html += '<button class="filter-btn" onclick="setFilter(this,\'watched\')">Watched</button>';
  html += '<button class="filter-btn" onclick="setFilter(this,\'unwatched\')">Unwatched</button>';
  html += '<button class="filter-btn" onclick="setFilter(this,\'on_watchlist\')">Watchlisted</button>';
  html += '</div>';

  html += '<div class="works-grid" id="worksGrid"></div>';
  document.getElementById('results').innerHTML = html;
  renderGrid();
}

function setFilter(btn, filter) {
  activeFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  renderGrid();
}

function renderGrid() {
  var filtered = allWorks.filter(function(w) {
    if (activeFilter === 'movie') return w.media_type === 'movie';
    if (activeFilter === 'tv') return w.media_type === 'tv';
    if (activeFilter === 'in_library') return w.in_library;
    if (activeFilter === 'missing') return !w.in_library;
    if (activeFilter === 'watched') return w.watched;
    if (activeFilter === 'unwatched') return !w.watched;
    if (activeFilter === 'on_watchlist') return w.on_watchlist;
    return true;
  });

  var html = '';
  filtered.forEach(function(w) {
    var poster = w.poster_path ? TMDB_IMG + 'w300' + w.poster_path : '';
    var year = (w.release_date || '').substring(0, 4);
    var roles = (w.roles || []).join(', ');
    var mtype = w.media_type === 'tv' ? 'show' : 'movie';
    var link = w.imdb_id ? '/item/' + w.imdb_id + '?type=' + mtype : (w.id ? '/item/_?tmdb_id=' + w.id + '&type=' + mtype : '#');

    html += '<a href="' + link + '" class="work-card">';
    if (poster) {
      html += '<img class="work-poster" src="' + poster + '" alt="" loading="lazy" />';
    } else {
      html += '<div class="work-poster" style="display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:0.8rem;">No poster</div>';
    }
    html += '<div class="work-info">';
    html += '<div class="work-title" title="' + esc(w.title || w.name || '') + '">' + esc(w.title || w.name || '') + '</div>';
    html += '<div class="work-year">' + year;
    if (w.in_library) {
      html += ' <span class="badge-library">✓ In Library</span>';
    } else {
      html += ' <span class="badge-missing">Missing</span>';
      if (w.media_type === 'movie' && w.id && radarrServers.length > 0) {
        html += ' <span class="badge-radarr" onclick="sendToRadarr(' + w.id + ',\'' + esc(w.title || '').replace(/'/g, "\\'") + '\',\'' + year + '\',event)" title="Send to Radarr">📥</span>';
      }
      if (w.media_type === 'tv' && sonarrServers.length > 0) {
        html += ' <span class="badge-sonarr" onclick="sendToSonarr(\'' + esc(w.tvdb_id || '') + '\',\'' + esc(w.imdb_id || '') + '\',\'' + esc(w.name || w.title || '').replace(/'/g, "\\'") + '\',\'' + year + '\',\'' + esc(w.id || '') + '\',event)" title="Send to Sonarr">📥</span>';
      }
    }
    if (w.watched) {
      html += ' <span class="badge-watched">✓ Watched</span>';
    }
    if (w.on_watchlist && !w.watched) {
      html += ' <span class="badge-watchlist">📋 Watchlisted</span>';
    }
    html += '</div>';
    if (roles) html += '<div class="work-role" title="' + esc(roles) + '">' + esc(roles) + '</div>';
    html += '</div></a>';
  });
  if (!html) html = '<div class="empty" style="grid-column:1/-1;">No items match this filter</div>';
  document.getElementById('worksGrid').innerHTML = html;
}

function esc(s) { if (!s && s !== 0) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* Watchlist sync — once per page load, throttled to 30 min */
var _wlSynced = false;
async function syncWatchlistOnce() {
  if (_wlSynced) return;
  _wlSynced = true;
  var key = 'filmography_wl_sync_ts';
  var last = parseInt(localStorage.getItem(key) || '0');
  if (Date.now() - last < 30 * 60 * 1000) return;  /* 30 min throttle */
  try {
    var r = await fetch('/api/watchlist/sync/0', { method: 'POST' });
    if (r.ok) {
      localStorage.setItem(key, String(Date.now()));
    } else {
      _wlSynced = false;  /* allow retry within this page session */
    }
  } catch(e) {
    _wlSynced = false;  /* network failure — don't throttle, allow retry */
  }
}

/* Init */
// Replace current state so back from a person search lands here (not previous page)
history.replaceState({ home: true }, '', '/filmography');

window.addEventListener('popstate', function(e) {
  if (!e.state || e.state.home) {
    // Returned to filmography home — restore suggestions view
    document.getElementById('searchInput').value = '';
    document.getElementById('results').innerHTML = '';
    allWorks = [];
    activeFilter = 'all';
    loadSuggestions();
  } else if (e.state.person) {
    // Navigated back to a specific person search
    document.getElementById('searchInput').value = e.state.person;
    doSearch();
  }
});

// Check URL for ?q= param (direct link or forward/back)
var _initQ = new URLSearchParams(window.location.search).get('q');
if (_initQ) {
  document.getElementById('searchInput').value = _initQ;
  doSearch();
} else {
  loadSuggestions();
}
loadRadarrServers();
loadSonarrServers();
syncWatchlistOnce();
</script>
