<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewing Goals — Emby-Simkl Suite</title>
<style>
  :root {
    --bg: #0D0F14;
    --surface: #151820;
    --surface-hover: #1C2030;
    --border: #222838;
    --text: #E6EDF3;
    --text-dim: #7D8590;
    --accent: #7B68EE;
    --accent-light: #9585F0;
    --green: #4AAD6E;
    --orange: #D29922;
    --red: #E05252;
    --blue: #7B8CDE;
    --radius: 10px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
  .container { max-width: 800px; margin: 0 auto; padding: 28px 20px; }
  h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 20px; }
  .btn { padding: 8px 18px; border: none; border-radius: var(--radius); cursor: pointer; font-weight: 600; font-size: 0.85rem; }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-accent:hover { opacity: 0.9; }
  .btn-sm { padding: 5px 12px; font-size: 0.78rem; }
  .btn-danger { background: none; border: 1px solid var(--red); color: var(--red); }
  .btn-danger:hover { background: var(--red); color: #fff; }

  .new-goal-form {
    padding: 18px; background: var(--surface); border-radius: var(--radius);
    border: 1px solid var(--border); margin-bottom: 24px; display: none;
  }
  .new-goal-form.visible { display: block; }
  .form-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
  .form-row label { font-size: 0.85rem; color: var(--text-dim); min-width: 80px; }
  .form-row input, .form-row select {
    flex: 1; padding: 8px 12px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--surface-hover); color: var(--text); font-size: 0.88rem; min-width: 140px;
  }
  .form-row input:focus, .form-row select:focus { border-color: var(--accent); outline: none; }

  .goals-list { display: flex; flex-direction: column; gap: 12px; }
  .goal-card {
    padding: 16px 20px; background: var(--surface); border-radius: var(--radius);
    border: 1px solid var(--border); position: relative;
  }
  .goal-card.completed { opacity: 0.65; }
  .goal-card:hover { border-color: var(--accent); }
  .goal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .goal-title { font-size: 1rem; font-weight: 600; }
  .goal-meta { font-size: 0.78rem; color: var(--text-dim); }
  .goal-progress-bar { height: 8px; background: var(--surface-hover); border-radius: 4px; overflow: hidden; margin: 8px 0; }
  .goal-progress-fill { height: 100%; border-radius: 4px; transition: width 0.4s; }
  .goal-progress-fill.low { background: var(--red); }
  .goal-progress-fill.mid { background: var(--orange); }
  .goal-progress-fill.high { background: var(--accent); }
  .goal-progress-fill.done { background: var(--green); }
  .goal-stats { display: flex; align-items: center; justify-content: space-between; font-size: 0.82rem; }
  .goal-count { font-weight: 600; }
  .goal-count.done { color: var(--green); }
  .badge-done { background: rgba(74,173,110,0.15); color: var(--green); padding: 2px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
  .badge-active { background: rgba(123,104,238,0.15); color: var(--accent); padding: 2px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
  .badge-overdue { background: rgba(224,82,82,0.15); color: var(--red); padding: 2px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
  .loading { text-align: center; color: var(--text-dim); padding: 40px; }
  .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; color: var(--text-dim); padding: 40px; font-size: 0.95rem; }
  .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  a { color: inherit; text-decoration: none; }
</style>
</head>
<body>
<nav class="suite-nav" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#0D0F14;border-bottom:1px solid #222838;padding:10px 24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <span style="color:#7D8590;font-size:0.85rem;font-weight:700;letter-spacing:0.5px;margin-right:10px;">EMBY-SIMKL SUITE</span>
    <a href="/" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">Dashboard</a>
    <a href="/lists" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">📋 Lists</a>
    <a href="/watch-history" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">📜 History</a>
    <a href="/library-health" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">🏥 Health</a>
    <a href="/filmography" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">🎬 Filmography</a>
    <a href="/goals" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:#1C2030;color:#ffffff;font-weight:600;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='#1C2030'">🎯 Goals</a>
    <a href="/settings" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">⚙️ Settings</a>
    <a href="/guide" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">📖 Guide</a>
</nav>
<div class="container">
  <div class="top-row">
    <h1>🎯 Viewing Goals</h1>
    <button class="btn btn-accent" onclick="toggleForm()">＋ New Goal</button>
  </div>

  <div class="new-goal-form" id="goalForm">
    <div class="form-row">
      <label>Goal Type</label>
      <select id="goalType" onchange="updateFormFields()">
        <option value="count">Watch X items</option>
        <option value="finish_series">Finish a series</option>
      </select>
    </div>
    <div class="form-row">
      <label>Title</label>
      <input type="text" id="goalTitle" placeholder="e.g. Watch 5 movies this week" />
    </div>
    <div class="form-row" id="countRow">
      <label>Target</label>
      <input type="number" id="goalTarget" min="1" value="5" style="max-width:80px;" />
      <select id="goalItemTypes">
        <option value="movie,episode">Movies &amp; Episodes</option>
        <option value="movie">Movies only</option>
        <option value="episode">Episodes only</option>
      </select>
    </div>
    <div class="form-row" id="seriesRow" style="display:none;">
      <label>Series</label>
      <input type="text" id="goalSeries" placeholder="e.g. Breaking Bad" />
    </div>
    <div class="form-row">
      <label>Deadline</label>
      <input type="date" id="goalDeadline" />
    </div>
    <div class="form-row" style="justify-content:flex-end;">
      <button class="btn" style="background:var(--surface-hover);color:var(--text-dim);" onclick="toggleForm()">Cancel</button>
      <button class="btn btn-accent" onclick="createGoal()">Create Goal</button>
    </div>
  </div>

  <div id="goalsList" class="goals-list">
    <div class="loading"><div class="spinner"></div> Loading goals…</div>
  </div>
</div>
<script>
var currentUserId = null;

async function init() {
  try {
    var r = await fetch('/auth/users');
    var users = await r.json();
    if (users.length > 0) currentUserId = users[0].id;
    loadGoals();
  } catch(e) { console.error(e); }
}

function toggleForm() {
  document.getElementById('goalForm').classList.toggle('visible');
}

function updateFormFields() {
  var type = document.getElementById('goalType').value;
  document.getElementById('countRow').style.display = type === 'count' ? 'flex' : 'none';
  document.getElementById('seriesRow').style.display = type === 'finish_series' ? 'flex' : 'none';
}

async function loadGoals() {
  if (!currentUserId) return;
  var el = document.getElementById('goalsList');
  try {
    var r = await fetch('/api/goals/' + currentUserId);
    var data = await r.json();
    renderGoals(data.goals || []);
  } catch(e) {
    el.innerHTML = '<div class="empty">Error loading goals</div>';
  }
}

function renderGoals(goals) {
  var el = document.getElementById('goalsList');
  if (!goals.length) {
    el.innerHTML = '<div class="empty">No goals yet — create one to start tracking your viewing progress.</div>';
    return;
  }

  var html = '';
  goals.forEach(function(g) {
    var pct = 0;
    if (g.goal_type === 'count' && g.target_count) {
      pct = Math.min(100, Math.round(g.current_count / g.target_count * 100));
    } else if (g.goal_type === 'finish_series') {
      pct = g.completed ? 100 : 0;
    }

    var fillClass = pct >= 100 ? 'done' : pct >= 60 ? 'high' : pct >= 25 ? 'mid' : 'low';
    var isOverdue = g.deadline && !g.completed && new Date(g.deadline) < new Date();

    var badge = '';
    if (g.completed) badge = '<span class="badge-done">✓ Complete</span>';
    else if (isOverdue) badge = '<span class="badge-overdue">Overdue</span>';
    else badge = '<span class="badge-active">Active</span>';

    html += '<div class="goal-card' + (g.completed ? ' completed' : '') + '">';
    html += '<div class="goal-header"><div class="goal-title">' + esc(g.title) + '</div>' + badge + '</div>';

    if (g.deadline) {
      var dl = new Date(g.deadline);
      html += '<div class="goal-meta">Deadline: ' + dl.toLocaleDateString() + '</div>';
    }

    html += '<div class="goal-progress-bar"><div class="goal-progress-fill ' + fillClass + '" style="width:' + pct + '%;"></div></div>';

    html += '<div class="goal-stats">';
    if (g.goal_type === 'count') {
      html += '<span class="goal-count' + (g.completed ? ' done' : '') + '">' + (g.current_count || 0) + ' / ' + g.target_count + '</span>';
    } else {
      html += '<span class="goal-count' + (g.completed ? ' done' : '') + '">' + (g.completed ? 'Finished!' : 'In progress') + '</span>';
    }
    html += '<span style="font-size:0.82rem;font-weight:600;color:' + (pct >= 100 ? 'var(--green)' : 'var(--accent)') + ';">' + pct + '%</span>';
    html += '</div>';

    html += '<div style="margin-top:10px;text-align:right;">';
    html += '<button class="btn btn-sm btn-danger" onclick="deleteGoal(' + g.id + ')">Delete</button>';
    html += '</div>';
    html += '</div>';
  });
  el.innerHTML = html;
}

async function createGoal() {
  var type = document.getElementById('goalType').value;
  var title = document.getElementById('goalTitle').value.trim();
  if (!title) { alert('Please enter a title'); return; }

  var body = {
    user_id: currentUserId,
    title: title,
    goal_type: type,
  };

  if (type === 'count') {
    body.target_count = parseInt(document.getElementById('goalTarget').value) || 5;
    body.item_types = document.getElementById('goalItemTypes').value;
  } else {
    body.target_series = document.getElementById('goalSeries').value.trim();
  }

  var deadline = document.getElementById('goalDeadline').value;
  if (deadline) body.deadline = deadline + 'T23:59:59';

  try {
    var r = await fetch('/api/goals', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    if (r.ok) {
      toggleForm();
      document.getElementById('goalTitle').value = '';
      document.getElementById('goalSeries').value = '';
      loadGoals();
    }
  } catch(e) { alert('Error: ' + e.message); }
}

async function deleteGoal(id) {
  if (!confirm('Delete this goal?')) return;
  try {
    await fetch('/api/goals/' + id, { method: 'DELETE' });
    loadGoals();
  } catch(e) { alert('Error: ' + e.message); }
}

function esc(s) { if (!s && s !== 0) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

init();
</script>
</body>
</html>
