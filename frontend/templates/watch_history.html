<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch History - Emby-Trakt Suite</title>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-hover: #22263a;
      --border: #2a2e3e;
      --text: #e0e0e6;
      --text-dim: #8b8fa3;
      --accent: #6c5ce7;
      --accent-light: #a29bfe;
      --green: #00b894;
      --orange: #fdcb6e;
      --red: #e17055;
      --blue: #74b9ff;
      --radius: 10px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body.light-mode {
      --bg: #f5f6fa;
      --surface: #ffffff;
      --surface-hover: #f0f1f5;
      --border: #e2e4ea;
      --text: #1f2937;
      --text-dim: #6b7280;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.6;
      min-height: 100vh;
    }

    .header {
      padding: 28px 32px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }

    .container { max-width: 1200px; margin: 0 auto; padding: 28px 32px; }

    .user-select-row {
      display: flex; align-items: center; gap: 12px; margin-bottom: 24px;
    }
    .user-select-row label { font-size: 0.92rem; font-weight: 600; }
    .user-select-row select {
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      padding: 8px 14px; border-radius: 8px; font-size: 0.88rem; min-width: 180px;
    }

    .filter-bar {
      display: flex; gap: 8px; margin-bottom: 28px; flex-wrap: wrap; align-items: center;
    }
    .filter-btn {
      padding: 7px 16px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text-dim); font-size: 0.85rem;
      cursor: pointer; transition: all 0.15s; font-weight: 500;
    }
    .filter-btn:hover { background: var(--surface-hover); color: var(--text); }
    .filter-btn.active {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }
    .total-count {
      margin-left: auto; font-size: 0.85rem; color: var(--text-dim);
    }

    .date-group { margin-bottom: 32px; }
    .date-label {
      font-size: 0.88rem; font-weight: 600; color: var(--text-dim);
      margin-bottom: 14px; padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .date-items {
      display: flex; gap: 14px; flex-wrap: wrap;
    }

    .history-item { width: 130px; cursor: default; }
    .thumb-wrap {
      position: relative; width: 130px; height: 195px;
      border-radius: 8px; overflow: hidden;
      background: var(--surface); border: 1px solid var(--border);
    }
    .thumb-wrap img {
      width: 100%; height: 100%; object-fit: cover;
      display: block; opacity: 0; transition: opacity 0.25s;
    }
    .thumb-wrap img.loaded { opacity: 1; }
    .thumb-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; color: var(--text-dim); background: var(--surface);
      flex-direction: column; gap: 6px; padding: 12px; text-align: center;
    }
    .thumb-placeholder .ph-title {
      font-size: 0.7rem; color: var(--text-dim); line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden; word-break: break-word;
    }
    .play-count-badge {
      position: absolute; top: 6px; right: 6px;
      background: var(--accent); color: #fff;
      font-size: 0.72rem; font-weight: 700;
      padding: 2px 7px; border-radius: 5px;
      line-height: 1.3;
    }
    .item-title {
      margin-top: 6px; font-size: 0.78rem; color: var(--text);
      line-height: 1.35; overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .item-subtitle {
      font-size: 0.72rem; color: var(--text-dim); margin-top: 2px;
    }

    .loading { text-align: center; padding: 48px 0; color: var(--text-dim); font-size: 0.92rem; }
    .load-more-wrap { text-align: center; padding: 20px 0; }
    .load-more-btn {
      padding: 10px 28px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font-size: 0.88rem;
      cursor: pointer; transition: all 0.15s; font-weight: 500;
    }
    .load-more-btn:hover { background: var(--surface-hover); }
    .load-more-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .theme-toggle {
      margin-left: auto; padding: 6px 14px; border-radius: 8px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text-dim); cursor: pointer; font-size: 0.82rem;
    }
    .theme-toggle:hover { background: var(--surface-hover); }
  </style>
</head>
<body>
<script>if(localStorage.getItem('suite-theme')==='light')document.body.classList.add('light-mode');</script>

<nav class="suite-nav" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#12141c;border-bottom:1px solid #2a2e42;padding:10px 24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <span style="color:#8b8fa3;font-size:0.85rem;font-weight:700;letter-spacing:0.5px;margin-right:10px;">EMBY-TRAKT SUITE</span>
    <a href="/" style="color:#e0e0e6;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#22263a'" onmouseout="this.style.background='transparent'">Dashboard</a>
    <a href="/lists" style="color:#e0e0e6;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#22263a'" onmouseout="this.style.background='transparent'">📋 Lists</a>
    <a href="/predictions" style="color:#e0e0e6;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#22263a'" onmouseout="this.style.background='transparent'">🤖 Predictions</a>
    <a href="/bias" style="color:#e0e0e6;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#22263a'" onmouseout="this.style.background='transparent'">🎓 Taste Profile</a>
    <a href="/rewatch" style="color:#e0e0e6;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#22263a'" onmouseout="this.style.background='transparent'">🔁 Rewatch</a>
    <a href="/stats" style="color:#e0e0e6;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#22263a'" onmouseout="this.style.background='transparent'">📊 Stats</a>
    <a href="/watch-history" style="color:#e0e0e6;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:#22263a;color:#ffffff;font-weight:600;" onmouseover="this.style.background='#22263a'" onmouseout="this.style.background='#22263a'">📜 History</a>
    <a href="/library-health" style="color:#e0e0e6;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#22263a'" onmouseout="this.style.background='transparent'">🏥 Health</a>
    <a href="/settings" style="color:#e0e0e6;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#22263a'" onmouseout="this.style.background='transparent'">⚙️ Settings</a>
    <a href="/watch-party" style="color:#e0e0e6;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#22263a'" onmouseout="this.style.background='transparent'">👥 Watch Party</a>
    <a href="/guide" style="color:#e0e0e6;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#22263a'" onmouseout="this.style.background='transparent'">📖 Guide</a>
</nav>

<div class="header">
  <h1>📜 Watch History</h1>
  <button class="theme-toggle" onclick="toggleSuiteTheme()">☀️ Light</button>
</div>

<div class="container">

  <div class="user-select-row">
    <label>👤 User:</label>
    <select id="userSelect" onchange="resetAndLoad()">
      <option value="">Loading…</option>
    </select>
  </div>

  <div class="filter-bar">
    <button class="filter-btn active" data-type="all" onclick="setFilter('all', this)">All</button>
    <button class="filter-btn" data-type="movie" onclick="setFilter('movie', this)">Movies</button>
    <button class="filter-btn" data-type="episode" onclick="setFilter('episode', this)">Episodes</button>
    <span class="total-count" id="totalCount"></span>
  </div>

  <div id="timeline"></div>
  <div id="loadingMsg" class="loading">Select a user to load history…</div>
  <div id="loadMoreWrap" class="load-more-wrap" style="display:none;">
    <button class="load-more-btn" id="loadMoreBtn" onclick="loadMore()">Load more</button>
  </div>

</div>

<script>
function esc(s) { if (!s && s !== 0) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

let currentUserId = null;
let currentFilter = 'all';
let nextBefore = null;
let embyUrl = '';
let embyApiKey = '';
let isLoading = false;

function toggleSuiteTheme() {
  document.body.classList.toggle('light-mode');
  const isLight = document.body.classList.contains('light-mode');
  localStorage.setItem('suite-theme', isLight ? 'light' : 'dark');
}

function setFilter(type, btn) {
  currentFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  resetAndLoad();
}

function resetAndLoad() {
  currentUserId = parseInt(document.getElementById('userSelect').value);
  if (!currentUserId) return;
  nextBefore = null;
  document.getElementById('timeline').innerHTML = '';
  loadHistory();
}

function imgUrl(embyId) {
  if (!embyId || !embyUrl) return '';
  return embyUrl + '/Items/' + embyId + '/Images/Primary?maxWidth=200&api_key=' + embyApiKey;
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}

function itemLabel(item) {
  const sn = item.season_number != null ? String(item.season_number).padStart(2, '0') : null;
  const en = item.episode_number != null ? String(item.episode_number).padStart(2, '0') : null;

  if (item.item_type === 'episode') {
    const series = item.series_name || '';
    const epCode = (sn && en) ? ('S' + sn + ' E' + en) : '';
    const displayTitle = series || item.title || '';
    const sub = epCode ? (series ? series + ' ' + epCode : epCode) : series;
    return { title: displayTitle, sub: sub };
  }
  return { title: item.title || '', sub: 'Movie' };
}

function renderItem(item) {
  const url = imgUrl(item.emby_id);
  const label = itemLabel(item);
  if (!label.title) return '';
  const badge = item.play_count > 1 ? '<span class="play-count-badge">' + item.play_count + '\u00d7</span>' : '';
  const icon = item.item_type === 'movie' ? '🎬' : '📺';
  const phTitle = esc(label.title);

  let imgHtml;
  if (url) {
    imgHtml = '<img data-src="' + esc(url) + '" alt="' + phTitle + '">'
            + '<div class="thumb-placeholder">'
            + '<span>' + icon + '</span>'
            + '<span class="ph-title">' + phTitle + '</span></div>';
  } else {
    imgHtml = '<div class="thumb-placeholder">'
            + '<span>' + icon + '</span>'
            + '<span class="ph-title">' + phTitle + '</span></div>';
  }

  return '<div class="history-item">'
    + '<div class="thumb-wrap">' + imgHtml + badge + '</div>'
    + '<div class="item-title">' + esc(label.title) + '</div>'
    + '<div class="item-subtitle">' + esc(label.sub) + '</div>'
    + '</div>';
}

function renderDay(day) {
  const itemsHtml = day.items.map(renderItem).filter(Boolean).join('');
  if (!itemsHtml) return '';
  return '<div class="date-group">'
    + '<div class="date-label">' + esc(formatDate(day.date)) + '</div>'
    + '<div class="date-items">' + itemsHtml + '</div>'
    + '</div>';
}

/* ── Intersection Observer for lazy-loading images ── */
const imgObserver = new IntersectionObserver((entries) => {
  for (const entry of entries) {
    if (entry.isIntersecting) {
      const img = entry.target;
      const src = img.getAttribute('data-src');
      if (src) {
        img.src = src;
        img.removeAttribute('data-src');
        img.onload = function() {
          this.classList.add('loaded');
          const ph = this.parentElement.querySelector('.thumb-placeholder');
          if (ph) ph.style.display = 'none';
        };
        img.onerror = function() {
          this.style.display = 'none';
        };
      }
      imgObserver.unobserve(img);
    }
  }
}, { rootMargin: '200px' });

function observeNewImages() {
  document.querySelectorAll('.thumb-wrap img[data-src]').forEach(img => {
    imgObserver.observe(img);
  });
}

async function loadHistory() {
  if (isLoading || !currentUserId) return;
  isLoading = true;
  const loadingEl = document.getElementById('loadingMsg');
  const loadMoreWrap = document.getElementById('loadMoreWrap');
  const btn = document.getElementById('loadMoreBtn');

  if (!nextBefore) {
    loadingEl.textContent = 'Loading history\u2026';
    loadingEl.style.display = 'block';
  }
  btn.disabled = true;
  btn.textContent = 'Loading\u2026';

  try {
    let url = '/api/watch-history/' + currentUserId + '/by-date?days=30';
    if (nextBefore) url += '&before=' + nextBefore;
    if (currentFilter === 'movie') url += '&item_type=movie';
    else if (currentFilter === 'episode') url += '&item_type=episode';

    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();

    embyUrl = data.emby_url || '';
    embyApiKey = data.emby_api_key || '';
    nextBefore = data.next_before;

    const timeline = document.getElementById('timeline');

    for (const day of data.days) {
      const html = renderDay(day);
      if (html) timeline.insertAdjacentHTML('beforeend', html);
    }

    observeNewImages();

    document.getElementById('totalCount').textContent = data.total_days + ' days with watches';

    loadingEl.style.display = 'none';
    loadMoreWrap.style.display = nextBefore ? 'block' : 'none';
    btn.disabled = false;
    btn.textContent = 'Load more';

    if (data.days.length === 0 && !nextBefore && !timeline.innerHTML.trim()) {
      loadingEl.textContent = 'No watch history found.';
      loadingEl.style.display = 'block';
    }

  } catch (e) {
    console.error(e);
    document.getElementById('loadingMsg').textContent = 'Error: ' + e.message;
    document.getElementById('loadingMsg').style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Retry';
  }
  isLoading = false;
}

function loadMore() { loadHistory(); }

async function loadUsers() {
  try {
    const r = await fetch('/auth/users');
    const users = await r.json();
    const linked = users.filter(u => u.linked);
    const sel = document.getElementById('userSelect');
    sel.innerHTML = linked.map(u =>
      '<option value="' + u.id + '">' + esc(u.emby_username || u.emby_user_id) + '</option>'
    ).join('');
    if (linked.length > 0) {
      sel.value = linked[0].id;
      resetAndLoad();
    }
  } catch(e) { console.error(e); }
}

loadUsers();
</script>

</body>
</html>
