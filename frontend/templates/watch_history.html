<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch History - Emby-Simkl Suite</title>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <style>
    :root {
      --bg: #0D0F14;
      --surface: #151820;
      --surface-hover: #1C2030;
      --border: #222838;
      --text: #E6EDF3;
      --text-dim: #7D8590;
      --accent: #7B68EE;
      --accent-light: #9585F0;
      --green: #4AAD6E;
      --orange: #D29922;
      --red: #E05252;
      --blue: #7B8CDE;
      --radius: 10px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body.light-mode {
      --bg: #F6F8FA;
      --surface: #FFFFFF;
      --surface-hover: #E8ECF1;
      --border: #D0D7DE;
      --text: #1F2328;
      --text-dim: #656D76;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Full-viewport blurred backdrop ── */
    #bgBackdrop {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1; background-size: cover; background-position: center;
      filter: blur(10px) brightness(0.25); transform: scale(1.1);
      transition: opacity 0.8s; opacity: 0;
    }
    #bgBackdrop.loaded { opacity: 1; }

    /* ── History header bar ── */
    .history-header {
      background: rgba(18,20,28,0.96);
      border-bottom: 1px solid var(--border);
      padding: 18px 0 14px;
      position: sticky; top: 0; z-index: 10;
      backdrop-filter: blur(12px);
    }
    .history-header-inner {
      max-width: 1200px; margin: 0 auto; padding: 0 32px;
    }
    .history-title-row {
      display: flex; align-items: center; gap: 14px; margin-bottom: 14px; flex-wrap: wrap;
    }
    .history-title-row h1 {
      font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em;
      display: flex; align-items: center; gap: 8px;
    }
    .item-count-badge {
      background: var(--accent); color: #fff; font-size: 0.75rem;
      font-weight: 700; padding: 3px 10px; border-radius: 12px;
    }
    .history-title-row .user-select {
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; min-width: 160px;
      margin-left: auto;
    }
    .history-title-row .theme-toggle {
      padding: 6px 14px; border-radius: 8px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text-dim); cursor: pointer; font-size: 0.82rem;
    }
    .history-title-row .theme-toggle:hover { background: var(--surface-hover); }

    /* ── Filter bar ── */
    .history-filters {
      display: flex; gap: 4px; align-items: center; flex-wrap: nowrap;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .history-filters::-webkit-scrollbar { display: none; }
    .filter-btn {
      padding: 5px 11px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text-dim); font-size: 0.8rem;
      cursor: pointer; transition: all 0.15s; font-weight: 500; white-space: nowrap;
      flex-shrink: 0;
    }
    .filter-btn:hover { background: var(--surface-hover); color: var(--text); }
    .filter-btn.active {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }
    .filter-sep {
      width: 1px; height: 20px; background: var(--border); margin: 0 2px; flex-shrink: 0;
    }
    .rating-pill {
      padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border);
      background: transparent; color: var(--text-dim); font-size: 0.76rem;
      cursor: pointer; transition: all 0.15s; font-weight: 600;
      min-width: 26px; text-align: center; white-space: nowrap; flex-shrink: 0;
    }
    .rating-pill:hover { background: var(--surface-hover); color: var(--text); }
    .rating-pill.active {
      background: var(--blue); color: #fff; border-color: var(--blue);
    }
    .jump-select {
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; cursor: pointer;
      flex-shrink: 0;
    }

    /* ── Content panel ── */
    .content-panel {
      max-width: 1200px; margin: 0 auto; padding: 28px 32px;
      background: rgba(18,20,28,0.55); min-height: calc(100vh - 180px);
      border-radius: 0 0 12px 12px;
    }

    .date-group { margin-bottom: 32px; }
    .date-label {
      font-size: 0.88rem; font-weight: 600; color: var(--text-dim);
      margin-bottom: 14px; padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .date-items {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
      max-width: 100%;
    }
    /* Cap at 4 columns */
    @media (min-width: 1060px) {
      .date-items { grid-template-columns: repeat(4, 1fr); }
    }

    /* ── Card ── */
    .history-item {
      cursor: default;
      background: var(--surface); border-radius: 10px;
      overflow: hidden; border: 1px solid var(--border);
    }
    .thumb-wrap {
      position: relative; width: 100%; aspect-ratio: 16 / 9;
      overflow: hidden; background: var(--surface);
    }
    .thumb-wrap img {
      width: 100%; height: 100%; object-fit: cover;
      display: block; opacity: 0; transition: opacity 0.25s;
    }
    .thumb-wrap img.loaded { opacity: 1; }
    .thumb-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; color: var(--text-dim); background: var(--surface);
      flex-direction: column; gap: 6px; padding: 12px; text-align: center;
    }
    .thumb-placeholder .ph-title {
      font-size: 0.78rem; color: var(--text-dim); line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; word-break: break-word;
    }
    .rewatch-badge {
      position: absolute; top: 6px; right: 6px;
      background: #7c3aed; color: #fff;
      font-size: 0.68rem; font-weight: 700;
      padding: 2px 7px; border-radius: 5px;
      line-height: 1.3;
    }

    /* ── Progress bar + time remaining ── */
    .progress-wrap {
      position: absolute; bottom: 0; left: 0; right: 0;
    }
    .progress-time {
      font-size: 0.68rem; font-weight: 600; color: #fff;
      padding: 2px 8px; text-align: right;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .progress-track { height: 4px; background: rgba(255,255,255,0.2); }
    .progress-fill { height: 100%; background: var(--orange); }

    .item-title {
      margin: 0; padding: 8px 10px 0; font-size: 0.82rem; color: var(--text);
      line-height: 1.35; overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
    }
    a.item-link {
      text-decoration: none; color: var(--text); transition: color 0.12s;
    }
    a.item-link:hover { color: var(--accent-light); }
    .item-subtitle {
      font-size: 0.74rem; color: var(--text-dim); padding: 2px 10px 8px;
    }

    .loading { text-align: center; padding: 48px 0; color: var(--text-dim); font-size: 0.92rem; }

    /* ── Pagination ── */
    .pagination {
      display: flex; justify-content: center; gap: 4px; padding: 24px 0 8px;
      flex-wrap: wrap;
    }
    .page-btn {
      min-width: 36px; height: 36px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text-dim); font-size: 0.85rem; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
      display: flex; align-items: center; justify-content: center;
    }
    .page-btn:hover { background: var(--surface-hover); color: var(--text); }
    .page-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .page-btn.disabled { opacity: 0.4; cursor: default; pointer-events: none; }
    .page-ellipsis {
      min-width: 36px; height: 36px; display: flex; align-items: center;
      justify-content: center; color: var(--text-dim); font-size: 0.85rem;
    }

    /* ── Hover action buttons (top of card) ── */
    .hover-actions {
      position: absolute; top: 0; left: 0; right: 0;
      background: linear-gradient(rgba(0,0,0,0.8), transparent);
      padding: 6px 8px 16px; display: flex; gap: 5px; justify-content: flex-end;
      opacity: 0; transition: opacity 0.2s ease; pointer-events: none; z-index: 6;
    }
    .thumb-wrap:hover .hover-actions { opacity: 1; pointer-events: auto; }
    .action-btn {
      padding: 4px 10px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.12); color: #fff; font-size: 0.68rem;
      font-weight: 700; cursor: pointer; transition: all 0.12s;
      white-space: nowrap; backdrop-filter: blur(4px);
    }
    .action-btn:hover { background: var(--blue); border-color: var(--blue); transform: scale(1.05); }
    .action-btn.mark-done:hover { background: var(--green); border-color: var(--green); }
    .action-btn.mark-done.done { background: var(--green); border-color: var(--green); pointer-events: none; }

    /* ── Rated badge ── */
    .rated-badge {
      position: absolute; top: 6px; left: 6px; z-index: 4;
      background: var(--green, #3D9A56); color: #fff;
      font-size: 0.72rem; font-weight: 800; min-width: 22px; height: 22px;
      border-radius: 5px; display: flex; align-items: center; justify-content: center;
      padding: 0 5px; box-shadow: 0 2px 6px rgba(0,0,0,0.4); line-height: 1;
    }
    .hover-rate-overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.85) 30%);
      padding: 22px 6px 6px; display: flex; justify-content: center; gap: 2px;
      opacity: 0; transition: opacity 0.2s ease; pointer-events: none; z-index: 5;
    }
    .thumb-wrap:hover .hover-rate-overlay { opacity: 1; pointer-events: auto; }
    .hover-rate-btn {
      width: 20px; height: 20px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.1); color: #fff; font-size: 0.65rem;
      font-weight: 700; cursor: pointer; display: flex; align-items: center;
      justify-content: center; transition: all 0.1s; padding: 0;
    }
    .hover-rate-btn:hover { background: var(--accent); border-color: var(--accent); transform: scale(1.15); }
    .hover-rate-btn.rated-ok { background: var(--green); border-color: var(--green); pointer-events: none; }
    .hover-rated-msg {
      position: absolute; bottom: 6px; left: 0; right: 0;
      text-align: center; color: var(--green); font-size: 0.75rem; font-weight: 700;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }
    .rating-num {
      width: 24px; height: 24px; border-radius: 4px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text-dim); font-size: 0.7rem;
      font-weight: 700; cursor: pointer; display: flex; align-items: center;
      justify-content: center; transition: all 0.12s;
    }
    .rating-num:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .rating-num.selected { background: var(--green); color: #fff; border-color: var(--green); }

    /* ── My Ratings Panel ── */
    .my-ratings-list { display: flex; flex-direction: column; gap: 8px; }
    .my-rating-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface); border-radius: 8px; padding: 8px 12px;
    }
    .my-rating-poster { width: 45px; height: 65px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
    .my-rating-poster-ph {
      width: 45px; height: 65px; border-radius: 4px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; background: var(--surface);
    }
    .my-rating-info { flex: 1; min-width: 0; }
    .my-rating-title {
      font-size: 0.85rem; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .my-rating-meta { font-size: 0.72rem; color: var(--text-dim); }
    .my-rating-value { font-size: 1.3rem; font-weight: 800; color: var(--accent); min-width: 30px; text-align: center; }
    .my-rating-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .my-rating-actions button {
      background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
      width: 28px; height: 28px; border-radius: 6px; cursor: pointer;
      font-size: 0.75rem; display: flex; align-items: center; justify-content: center;
    }
    .my-rating-actions button:hover { background: var(--surface-hover); color: var(--text); }
    .my-rating-actions button.delete:hover { background: var(--red); color: #fff; }
    .my-rating-edit-row { display: flex; gap: 3px; align-items: center; margin-top: 4px; }
    .my-rating-edit-row .rating-num { width: 24px; height: 24px; }
    .my-ratings-empty { padding: 30px; text-align: center; color: var(--text-dim); }
    .my-ratings-source-filter { display: flex; gap: 6px; margin-bottom: 12px; }
    .my-ratings-source-filter button {
      background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
      padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 0.78rem;
    }
    .my-ratings-source-filter button.active {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }
  </style>
<script src="/static/js/csrf.js"></script>
</head>

<script>
function esc(s) { if (!s && s !== 0) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

let currentUserId = null;
let currentFilter = 'all';
let currentRatingFilter = 'all';
let currentPage = 1;
let nextBefore = null;
let isLoading = false;

function toggleSuiteTheme() {
  document.body.classList.toggle('light-mode');
  const isLight = document.body.classList.contains('light-mode');
  localStorage.setItem('suite-theme', isLight ? 'light' : 'dark');
}

// Active type filters — multiple can be active at once
let activeTypeFilters = new Set();

function toggleTypeFilter(type, btn) {
  document.getElementById('myRatingsPanel').style.display = 'none';
  document.getElementById('timeline').style.display = '';
  document.getElementById('pagination').style.display = '';

  // Toggle this button on/off independently
  if (activeTypeFilters.has(type)) {
    activeTypeFilters.delete(type);
    btn.classList.remove('active');
  } else {
    activeTypeFilters.add(type);
    btn.classList.add('active');
  }

  currentPage = 1;
  nextBefore = null;
  document.getElementById('timeline').innerHTML = '';
  loadHistory();
}

// Legacy setFilter for compatibility
function setFilter(type, btn) { toggleTypeFilter(type, btn); }

// No client-side type filtering needed — API handles it via item_type param
function applyTypeFilters(days) { return days; }

function setRatingFilter(val, btn) {
  currentRatingFilter = val;
  document.querySelectorAll('.rating-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentPage = 1;
  nextBefore = null;
  document.getElementById('timeline').innerHTML = '';
  loadHistory();
}

function resetAndLoad() {
  currentUserId = parseInt(document.getElementById('userSelect').value);
  if (!currentUserId) return;
  currentPage = 1;
  nextBefore = null;
  document.getElementById('timeline').innerHTML = '';
  loadHistory();
  loadMonths();
}

function imgUrl(embyId, imageType) {
  if (!embyId) return '';
  return '/api/emby/image/' + embyId + '/' + imageType + '?maxWidth=400';
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}

function formatTimeLeft(runtimeMin, progress) {
  if (!runtimeMin || progress == null) return '';
  const left = Math.round(runtimeMin * (100 - progress) / 100);
  if (left >= 60) {
    const h = Math.floor(left / 60);
    const m = left % 60;
    return h + 'h ' + m + 'm left';
  }
  return left + ' min left';
}

function itemLabel(item) {
  const sn = item.season_number != null ? String(item.season_number).padStart(2, '0') : null;
  const en = item.episode_number != null ? String(item.episode_number).padStart(2, '0') : null;

  if (item.item_type === 'show') {
    const series = item.series_name || item.title || '';
    const epCount = item.play_count || 1;
    const sub = epCount === 1 ? '1 episode' : epCount + ' episodes';
    return { title: series, sub: sub };
  }
  if (item.item_type === 'episode') {
    const series = item.series_name || '';
    const epCode = (sn && en) ? ('S' + sn + ' E' + en) : '';
    const displayTitle = series || item.title || '';
    const sub = epCode ? (series ? series + ' ' + epCode : epCode) : series;
    return { title: displayTitle, sub: sub };
  }
  return { title: item.title || '', sub: 'Movie' };
}

function renderItem(item, _idx, _arr, dayDate) {
  const label = itemLabel(item);
  if (!label.title) return '';

  const imgType = item.item_type === 'movie' ? 'Thumb' : 'Primary';
  const effectiveId = item.emby_id || (item.item_type === 'episode' ? item.series_emby_id : null);
  const url = imgUrl(effectiveId, imgType);
  let fallbackUrl = '';
  if (item.item_type === 'movie') {
    fallbackUrl = imgUrl(item.emby_id, 'Primary');
  } else if (item.item_type === 'episode' && item.emby_id && item.series_emby_id) {
    fallbackUrl = imgUrl(item.series_emby_id, 'Primary');
  }

  const rewatchBadge = (item.total_watches && item.total_watches > 1)
    ? '<span class="rewatch-badge">\ud83d\udd01 ' + item.total_watches + '</span>'
    : '';
  const icon = item.item_type === 'movie' ? '🎬' : '📺';
  const phTitle = esc(label.title);

  let progressHtml = '';
  const prog = item.progress;
  if (prog !== null && prog !== undefined && prog < 95) {
    const timeLeft = formatTimeLeft(item.runtime_minutes, prog);
    const timeLabel = timeLeft || (prog + '%');
    progressHtml = '<div class="progress-wrap">'
                 + '<div class="progress-time">' + timeLabel + '</div>'
                 + '<div class="progress-track"><div class="progress-fill" style="width:' + prog + '%"></div></div>'
                 + '</div>';
  }

  const itemImdb = item.imdb_id || '';
  const itemTitle = (item.series_name || item.title || '').trim();
  const isEpisode = item.item_type === 'episode';
  const itemType = isEpisode ? 'episode' : (item.item_type === 'show' ? 'show' : 'movie');
  const sNum = item.season_number != null ? item.season_number : '';
  const eNum = item.episode_number != null ? item.episode_number : '';
  const badgeKey = isEpisode && sNum !== '' && eNum !== ''
    ? 'ep:' + itemTitle.toLowerCase() + ':s' + sNum + 'e' + eNum
    : (itemImdb ? 'imdb:' + itemImdb : 'title:' + itemTitle.toLowerCase());
  const dataAttrs = ' data-imdb="' + esc(itemImdb) + '" data-ratetitle="' + esc(itemTitle.toLowerCase()) + '" data-ratetype="' + esc(itemType) + '"'
    + ' data-tmdb="' + esc(item.tmdb_id || '') + '"'
    + ' data-badgekey="' + esc(badgeKey) + '"'
    + ' data-season="' + esc(String(sNum)) + '" data-episode="' + esc(String(eNum)) + '"'
    + ' data-seriesname="' + esc(item.series_name || '') + '"'
    + ' data-embyid="' + esc(item.emby_id || '') + '"';

  // Build hover action buttons
  let actionsHtml = '<div class="hover-actions">';
  // Mark Watched — show for in-progress items (not already at 100%).
  // For older days, hide if progress >= 80% (effectively watched per Simkl rules).
  const todayStr = new Date().toISOString().slice(0, 10);
  const isToday = (dayDate === todayStr);
  const showMarkWatched = prog !== null && prog !== undefined && prog > 0 && prog < 100
    && (isToday || prog < 80);
  if (showMarkWatched) {
    const mwData = JSON.stringify({
      emby_item_id: item.emby_id || null,
      imdb_id: itemImdb || null,
      tmdb_id: item.tmdb_id || null,
      item_type: itemType,
      title: itemTitle,
      season_number: sNum !== '' ? parseInt(sNum) : null,
      episode_number: eNum !== '' ? parseInt(eNum) : null,
      series_name: item.series_name || '',
    });
    actionsHtml += '<button class="action-btn mark-done" onclick="event.stopPropagation();markWatched(this)" data-mw=\'' + mwData.replace(/'/g, '&#39;') + '\'>✓ Mark Watched</button>';
  }
  // Play on Emby — always show if we have an emby_id
  if (item.emby_id) {
    actionsHtml += '<button class="action-btn" onclick="event.stopPropagation();pickDeviceAndPlay(\'' + esc(item.emby_id) + '\', 0)">▶ Play</button>';
  }
  actionsHtml += '</div>';

  let imgHtml;
  if (url) {
    const fbAttr = fallbackUrl ? ' data-fallback="' + esc(fallbackUrl) + '"' : '';
    imgHtml = '<img data-src="' + esc(url) + '"' + fbAttr + ' alt="' + phTitle + '">'
            + '<div class="thumb-placeholder">'
            + '<span>' + icon + '</span>'
            + '<span class="ph-title">' + phTitle + '</span></div>';
  } else {
    imgHtml = '<div class="thumb-placeholder">'
            + '<span>' + icon + '</span>'
            + '<span class="ph-title">' + phTitle + '</span></div>';
  }

  // Build detail page link
  const detailType = itemType === 'episode' ? 'show' : itemType;
  // For collapsed show items, use series-level IDs instead of episode IDs
  const detailImdb = (itemType === 'show' || itemType === 'episode')
    ? (item.series_imdb_id || itemImdb || '')
    : (itemImdb || '');
  const detailEmby = (itemType === 'show')
    ? (item.series_emby_id || item.emby_id || '')
    : (item.emby_id || '');
  const detailLink = detailImdb
    ? '/item/' + encodeURIComponent(detailImdb) + '?type=' + detailType
      + (detailEmby ? '&emby_id=' + encodeURIComponent(detailEmby) : '')
    : '';

  return '<div class="history-item">'
    + '<div class="thumb-wrap"' + dataAttrs + '>' + imgHtml + actionsHtml + rewatchBadge + progressHtml + '</div>'
    + (detailLink
      ? '<a class="item-title item-link" href="' + detailLink + '">' + esc(label.title) + '</a>'
      : '<div class="item-title">' + esc(label.title) + '</div>')
    + '<div class="item-subtitle">' + esc(label.sub) + '</div>'
    + '</div>';
}

function renderDay(day) {
  const dd = day.date;
  const itemsHtml = day.items.map(function(item, i, arr) { return renderItem(item, i, arr, dd); }).filter(Boolean).join('');
  if (!itemsHtml) return '';
  return '<div class="date-group">'
    + '<div class="date-label">' + esc(formatDate(day.date)) + '</div>'
    + '<div class="date-items">' + itemsHtml + '</div>'
    + '</div>';
}

/* ── IntersectionObserver: lazy-load images ── */
const imgObserver = new IntersectionObserver(function(entries) {
  for (const entry of entries) {
    if (entry.isIntersecting) {
      const img = entry.target;
      const src = img.getAttribute('data-src');
      if (src) {
        img.removeAttribute('data-src');
        img.onload = function() {
          this.classList.add('loaded');
          const ph = this.parentElement.querySelector('.thumb-placeholder');
          if (ph) ph.style.display = 'none';
        };
        img.onerror = function() {
          const fb = this.getAttribute('data-fallback');
          if (fb) {
            this.removeAttribute('data-fallback');
            this.src = fb;
          } else {
            this.style.display = 'none';
          }
        };
        img.src = src;
      }
      imgObserver.unobserve(img);
    }
  }
}, { rootMargin: '200px' });

function observeNewImages() {
  document.querySelectorAll('.thumb-wrap img[data-src]').forEach(function(img) {
    imgObserver.observe(img);
  });
}

/* ── Pagination rendering ── */
function renderPagination(totalDays, currentPg) {
  // Each page = 30 days worth of data
  const totalPages = Math.max(1, Math.ceil(totalDays / 30));
  if (totalPages <= 1) { document.getElementById('pagination').innerHTML = ''; return; }

  let html = '';
  // Prev
  html += '<button class="page-btn' + (currentPg <= 1 ? ' disabled' : '') + '" onclick="goToPage(' + (currentPg - 1) + ')">‹</button>';

  // Page numbers with ellipsis
  const maxVisible = 7;
  let pages = [];
  if (totalPages <= maxVisible) {
    for (let i = 1; i <= totalPages; i++) pages.push(i);
  } else {
    pages.push(1);
    let start = Math.max(2, currentPg - 2);
    let end = Math.min(totalPages - 1, currentPg + 2);
    if (start > 2) pages.push('...');
    for (let i = start; i <= end; i++) pages.push(i);
    if (end < totalPages - 1) pages.push('...');
    pages.push(totalPages);
  }

  for (const p of pages) {
    if (p === '...') {
      html += '<span class="page-ellipsis">…</span>';
    } else {
      html += '<button class="page-btn' + (p === currentPg ? ' active' : '') + '" onclick="goToPage(' + p + ')">' + p + '</button>';
    }
  }

  // Next
  html += '<button class="page-btn' + (currentPg >= totalPages ? ' disabled' : '') + '" onclick="goToPage(' + (currentPg + 1) + ')">›</button>';

  document.getElementById('pagination').innerHTML = html;
}

function goToPage(pg) {
  if (pg < 1) return;
  currentPage = pg;
  // Calculate the before date for pagination: skip (pg-1)*30 days
  // We use the load-more mechanism: reset and load page 1 data, or use before cursor
  // Simpler: always load from scratch with a date offset
  nextBefore = null;
  document.getElementById('timeline').innerHTML = '';
  loadHistory();
}

function buildTypeParam() {
  if (activeTypeFilters.size === 0 || activeTypeFilters.size === 3) return '';
  return '&item_type=' + Array.from(activeTypeFilters).join(',');
}

async function loadHistory() {
  if (isLoading || !currentUserId) return;
  isLoading = true;
  var loadingEl = document.getElementById('loadingMsg');

  loadingEl.textContent = 'Loading history…';
  loadingEl.style.display = 'block';

  try {
    var url = '/api/watch-history/' + currentUserId + '/by-date?days=30';

    // For pagination: skip forward by loading with before dates
    // Page 1 = no before, page 2+ = we need to chain-load
    if (currentPage > 1) {
      // Load all pages up to currentPage by chaining before cursors
      var cursor = null;
      for (var p = 1; p < currentPage; p++) {
        var skipUrl = '/api/watch-history/' + currentUserId + '/by-date?days=30';
        if (cursor) skipUrl += '&before=' + cursor;
        skipUrl += buildTypeParam();
        if (currentRatingFilter !== 'all') skipUrl += '&rating_filter=' + currentRatingFilter;
        var skipR = await fetch(skipUrl);
        if (!skipR.ok) throw new Error('HTTP ' + skipR.status);
        var skipData = await skipR.json();
        cursor = skipData.next_before;
        if (!cursor) { currentPage = p; break; } // no more pages
      }
      if (cursor) url += '&before=' + cursor;
    }

    url += buildTypeParam();
    if (currentRatingFilter !== 'all') url += '&rating_filter=' + currentRatingFilter;

    var r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var data = await r.json();

    nextBefore = data.next_before;

    // Update item count badge with type-aware label
    var countLabel = ' items';
    if (activeTypeFilters.size === 1) {
      var activeType = Array.from(activeTypeFilters)[0];
      if (activeType === 'movie') countLabel = ' movies';
      else if (activeType === 'show') countLabel = ' shows';
      else if (activeType === 'episode') countLabel = ' episodes';
    }
    document.getElementById('itemCount').textContent = (data.total_items || 0).toLocaleString() + countLabel;

    var timeline = document.getElementById('timeline');
    timeline.innerHTML = '';

    var filteredDays = applyTypeFilters(data.days);
    for (var i = 0; i < filteredDays.length; i++) {
      var html = renderDay(filteredDays[i]);
      if (html) timeline.insertAdjacentHTML('beforeend', html);
    }

    observeNewImages();
    if (ratedKeys.size > 0) applyRatingBadges();

    loadingEl.style.display = 'none';

    // Render pagination
    renderPagination(data.total_days || 0, currentPage);

    if (filteredDays.length === 0 && !timeline.innerHTML.trim()) {
      loadingEl.textContent = 'No watch history found.';
      loadingEl.style.display = 'block';
    }

    // Scroll to top on page change
    if (currentPage > 1) {
      document.querySelector('.content-panel').scrollIntoView({ behavior: 'smooth' });
    }

  } catch (e) {
    console.error(e);
    loadingEl.textContent = 'Error: ' + e.message;
    loadingEl.style.display = 'block';
  }
  isLoading = false;
}

/* ── Jump to month ── */
async function loadMonths() {
  if (!currentUserId) return;
  try {
    var r = await fetch('/api/watch-history/' + currentUserId + '/months');
    if (!r.ok) return;
    var data = await r.json();
    var sel = document.getElementById('jumpMonth');
    sel.innerHTML = '<option value="">📅 Jump to month</option>';
    (data.months || []).forEach(function(m) {
      sel.innerHTML += '<option value="' + esc(m.value) + '">' + esc(m.label) + '</option>';
    });
  } catch (e) { console.error('loadMonths error:', e); }
}

function jumpToMonth(val) {
  if (!val) return;
  // val = "2026-08" — set before to first day of next month
  var parts = val.split('-');
  var y = parseInt(parts[0]), m = parseInt(parts[1]);
  // First day of next month
  if (m === 12) { y++; m = 1; } else { m++; }
  var beforeDate = y + '-' + String(m).padStart(2, '0') + '-01';

  // Direct load with this before date instead of pagination
  currentPage = 1;
  nextBefore = null;
  document.getElementById('timeline').innerHTML = '';

  isLoading = true;
  var loadingEl = document.getElementById('loadingMsg');
  loadingEl.textContent = 'Loading history…';
  loadingEl.style.display = 'block';

  var url = '/api/watch-history/' + currentUserId + '/by-date?days=30&before=' + beforeDate;
  url += buildTypeParam();
  if (currentRatingFilter !== 'all') url += '&rating_filter=' + currentRatingFilter;

  fetch(url).then(function(r) { return r.json(); }).then(function(data) {
    nextBefore = data.next_before;
    var jmCountLabel = ' items';
    if (activeTypeFilters.size === 1) {
      var jmActiveType = Array.from(activeTypeFilters)[0];
      if (jmActiveType === 'movie') jmCountLabel = ' movies';
      else if (jmActiveType === 'show') jmCountLabel = ' shows';
      else if (jmActiveType === 'episode') jmCountLabel = ' episodes';
    }
    document.getElementById('itemCount').textContent = (data.total_items || 0).toLocaleString() + jmCountLabel;
    var timeline = document.getElementById('timeline');
    var jmFiltered = applyTypeFilters(data.days);
    for (var i = 0; i < jmFiltered.length; i++) {
      var html = renderDay(jmFiltered[i]);
      if (html) timeline.insertAdjacentHTML('beforeend', html);
    }
    observeNewImages();
    if (ratedKeys.size > 0) applyRatingBadges();
    loadingEl.style.display = 'none';
    // Hide pagination when jumping to month — show load-more style
    document.getElementById('pagination').innerHTML =
      nextBefore ? '<button class="page-btn" onclick="loadMoreFromCursor()" style="padding:8px 24px;">Load more</button>' : '';
    if (jmFiltered.length === 0) {
      loadingEl.textContent = 'No history for this month.';
      loadingEl.style.display = 'block';
    }
    isLoading = false;
  }).catch(function(e) {
    loadingEl.textContent = 'Error: ' + e.message;
    loadingEl.style.display = 'block';
    isLoading = false;
  });
}

function loadMoreFromCursor() {
  if (!nextBefore || isLoading) return;
  isLoading = true;
  var url = '/api/watch-history/' + currentUserId + '/by-date?days=30&before=' + nextBefore;
  url += buildTypeParam();
  if (currentRatingFilter !== 'all') url += '&rating_filter=' + currentRatingFilter;

  fetch(url).then(function(r) { return r.json(); }).then(function(data) {
    nextBefore = data.next_before;
    var timeline = document.getElementById('timeline');
    var lmFiltered = applyTypeFilters(data.days);
    for (var i = 0; i < lmFiltered.length; i++) {
      var html = renderDay(lmFiltered[i]);
      if (html) timeline.insertAdjacentHTML('beforeend', html);
    }
    observeNewImages();
    if (ratedKeys.size > 0) applyRatingBadges();
    document.getElementById('pagination').innerHTML =
      nextBefore ? '<button class="page-btn" onclick="loadMoreFromCursor()" style="padding:8px 24px;">Load more</button>' : '';
    isLoading = false;
  }).catch(function(e) { console.error(e); isLoading = false; });
}

/* ═══════════════════════════════════════════════════════════════════════
   Hover-to-Rate System
   ═══════════════════════════════════════════════════════════════════════ */

let ratedKeys = new Map();
let ratingSynced = false;

async function syncRatingsOnce() {
  if (ratingSynced || !currentUserId) return;
  ratingSynced = true;
  try {
    await fetch('/api/ratings/sync/' + currentUserId, {
      method: 'POST', headers: {'Content-Type': 'application/json'}
    });
  } catch (e) { console.error('syncRatings error:', e); }
}

async function loadRatedKeys() {
  if (!currentUserId) return;
  await syncRatingsOnce();
  try {
    var r = await fetch('/api/ratings/user/' + currentUserId + '?limit=50000');
    if (!r.ok) return;
    var data = await r.json();
    ratedKeys = new Map();
    (data.items || []).forEach(function(item) {
      if (item.item_type === 'episode' && item.series_name && item.season_number != null && item.episode_number != null) {
        var epKey = 'ep:' + item.series_name.trim().toLowerCase() + ':s' + item.season_number + 'e' + item.episode_number;
        ratedKeys.set(epKey, item.rating);
      }
      if (item.imdb_id) ratedKeys.set('imdb:' + item.imdb_id, item.rating);
      if (item.title) ratedKeys.set('title:' + item.title.trim().toLowerCase(), item.rating);
    });
    applyRatingBadges();
  } catch (e) { console.error('loadRatedKeys error:', e); }
}

function applyRatingBadges() {
  if (ratedKeys.size === 0) return;
  document.querySelectorAll('.thumb-wrap[data-badgekey]').forEach(function(wrap) {
    var old = wrap.querySelector('.rated-badge');
    if (old) old.remove();
    var oldOverlay = wrap.querySelector('.hover-rate-overlay');
    if (oldOverlay) oldOverlay.remove();

    var badgeKey = wrap.getAttribute('data-badgekey');
    var imdb = wrap.getAttribute('data-imdb');
    var title = wrap.getAttribute('data-ratetitle');
    var tmdb = wrap.getAttribute('data-tmdb');
    var itemType = wrap.getAttribute('data-ratetype') || 'movie';
    var season = wrap.getAttribute('data-season');
    var episode = wrap.getAttribute('data-episode');
    var seriesName = wrap.getAttribute('data-seriesname');

    var rating = ratedKeys.get(badgeKey);
    if (rating === undefined && imdb) rating = ratedKeys.get('imdb:' + imdb);
    if (rating === undefined && title) rating = ratedKeys.get('title:' + title);

    if (rating !== undefined) {
      var badge = document.createElement('div');
      badge.className = 'rated-badge';
      badge.textContent = rating;
      wrap.appendChild(badge);
    } else if (imdb || title) {
      var itemJson = JSON.stringify({
        imdb_id: imdb || null,
        tmdb_id: tmdb || null,
        title: (itemType === 'episode' ? (seriesName || title) : title) || '',
        item_type: itemType,
        season_number: season ? parseInt(season) : null,
        episode_number: episode ? parseInt(episode) : null,
        series_name: seriesName || '',
      });
      var overlay = document.createElement('div');
      overlay.className = 'hover-rate-overlay';
      var btns = '';
      for (var n = 1; n <= 10; n++) {
        btns += '<button class="hover-rate-btn" onclick="event.stopPropagation();hoverRate(this,' + n + ')" data-item=\'' + itemJson.replace(/'/g, '&#39;') + '\'>' + n + '</button>';
      }
      overlay.innerHTML = btns;
      wrap.appendChild(overlay);
    }
  });
}

async function hoverRate(btnEl, value) {
  var itemData;
  try { itemData = JSON.parse(btnEl.getAttribute('data-item')); } catch(e) { return; }
  if (!itemData) return;

  var overlay = btnEl.parentElement;
  overlay.querySelectorAll('.hover-rate-btn').forEach(function(b) { b.style.opacity = '0.4'; });
  btnEl.style.opacity = '1';
  btnEl.classList.add('rated-ok');

  try {
    var r = await fetch('/api/rate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        user_id: currentUserId,
        imdb_id: itemData.imdb_id || null,
        tmdb_id: itemData.tmdb_id || null,
        rating: value,
        item_type: itemData.item_type,
        title: itemData.title,
        season_number: itemData.season_number || null,
        episode_number: itemData.episode_number || null,
        series_name: itemData.series_name || ''
      })
    });
    if (!r.ok) {
      var errData = await r.json().catch(function() { return {}; });
      throw new Error(errData.detail || 'HTTP ' + r.status);
    }
    var key;
    if (itemData.item_type === 'episode' && itemData.series_name && itemData.season_number && itemData.episode_number) {
      key = 'ep:' + itemData.series_name.trim().toLowerCase() + ':s' + itemData.season_number + 'e' + itemData.episode_number;
    } else if (itemData.imdb_id) {
      key = 'imdb:' + itemData.imdb_id;
    } else {
      key = 'title:' + (itemData.title || '').trim().toLowerCase();
    }
    ratedKeys.set(key, value);
    overlay.innerHTML = '<div class="hover-rated-msg">\u2713 ' + value + '/10</div>';
  } catch (e) {
    console.error('hoverRate error:', e);
    overlay.querySelectorAll('.hover-rate-btn').forEach(function(b) { b.style.opacity = ''; });
    btnEl.classList.remove('rated-ok');
    overlay.insertAdjacentHTML('beforeend', '<div class="hover-rated-msg" style="color:var(--red)">\u2717 ' + (e.message || 'Error').substring(0, 40) + '</div>');
    setTimeout(function() {
      var msg = overlay.querySelector('.hover-rated-msg');
      if (msg) msg.remove();
    }, 3000);
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   My Ratings Panel
   ═══════════════════════════════════════════════════════════════════════ */

let myRatingsSource = 'user';
let myRatingsData = [];

function showMyRatings(btn) {
  activeTypeFilters.clear();
  document.querySelectorAll('.filter-btn[data-type]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('timeline').style.display = 'none';
  document.getElementById('pagination').style.display = 'none';
  document.getElementById('myRatingsPanel').style.display = 'block';
  loadMyRatings();
}

async function loadMyRatings() {
  if (!currentUserId) return;
  var panel = document.getElementById('myRatingsPanel');
  panel.innerHTML = '<div class="loading">Loading ratings…</div>';
  try {
    var url = '/api/ratings/user/' + currentUserId + '?limit=200';
    if (myRatingsSource) url += '&source=' + myRatingsSource;
    var r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var data = await r.json();
    myRatingsData = data.items || [];
    renderMyRatings();
  } catch (e) {
    panel.innerHTML = '<div class="my-ratings-empty">Error loading ratings: ' + esc(e.message) + '</div>';
  }
}

function renderMyRatings() {
  var panel = document.getElementById('myRatingsPanel');
  var filterHtml = '<div class="my-ratings-source-filter">'
    + '<button class="' + (myRatingsSource === 'user' ? 'active' : '') + '" onclick="setRatingSource(\'user\')">My Ratings</button>'
    + '<button class="' + (myRatingsSource === '' ? 'active' : '') + '" onclick="setRatingSource(\'\')">All Ratings</button>'
    + '<button class="' + (myRatingsSource === 'imported' ? 'active' : '') + '" onclick="setRatingSource(\'imported\')">Imported</button>'
    + '</div>';

  if (!myRatingsData.length) {
    panel.innerHTML = filterHtml + '<div class="my-ratings-empty">No ratings found.</div>';
    return;
  }

  var rows = myRatingsData.map(function(item, idx) {
    var posterHtml;
    var posterId = item.emby_id || item.series_emby_id;
    var posterEmoji = item.item_type === 'episode' ? '📺' : (item.item_type === 'show' ? '📺' : '🎬');
    if (posterId) {
      posterHtml = '<img class="my-rating-poster" src="' + esc(imgUrl(posterId, 'Primary'))
                 + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
                 + '<div class="my-rating-poster-ph" style="display:none">'
                 + posterEmoji + '</div>';
    } else {
      posterHtml = '<div class="my-rating-poster-ph">' + posterEmoji + '</div>';
    }
    var meta = '';
    if (item.item_type === 'episode') {
      meta = 'Episode';
      if (item.season_number != null && item.episode_number != null) {
        meta += ' · S' + String(item.season_number).padStart(2, '0') + 'E' + String(item.episode_number).padStart(2, '0');
      }
    } else if (item.item_type === 'show') {
      meta = 'Show';
    } else {
      meta = 'Movie';
    }
    if (item.rated_at) {
      var d = new Date(item.rated_at);
      meta += ' · ' + d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }
    if (item.source === 'imported') meta += ' · imported';

    var actions = '';
    if (item.source === 'user') {
      actions = '<div class="my-rating-actions">'
        + '<button onclick="editMyRating(' + idx + ')" title="Edit">✏️</button>'
        + '<button class="delete" onclick="deleteMyRating(' + idx + ')" title="Delete">🗑️</button>'
        + '</div>';
    }

    var displayTitle = item.series_name || item.title;
    return '<div class="my-rating-row" id="myRatingRow' + idx + '">'
      + posterHtml
      + '<div class="my-rating-info">'
      + '<div class="my-rating-title" title="' + esc(displayTitle) + '">' + esc(displayTitle) + '</div>'
      + '<div class="my-rating-meta">' + esc(meta) + '</div>'
      + '<div class="my-rating-edit-row" id="myRatingEdit' + idx + '" style="display:none"></div>'
      + '</div>'
      + '<div class="my-rating-value">' + item.rating + '</div>'
      + actions
      + '</div>';
  }).join('');

  panel.innerHTML = filterHtml + '<div class="my-ratings-list">' + rows + '</div>';
}

function setRatingSource(src) { myRatingsSource = src; loadMyRatings(); }

function editMyRating(idx) {
  var item = myRatingsData[idx];
  if (!item) return;
  var editRow = document.getElementById('myRatingEdit' + idx);
  if (editRow.style.display !== 'none') { editRow.style.display = 'none'; return; }
  var nums = '';
  for (var n = 1; n <= 10; n++) {
    var sel = (n === item.rating) ? ' selected' : '';
    nums += '<button class="rating-num' + sel + '" onclick="saveMyRating(' + idx + ',' + n + ',this)">' + n + '</button>';
  }
  editRow.innerHTML = nums;
  editRow.style.display = 'flex';
}

async function saveMyRating(idx, value, btnEl) {
  var item = myRatingsData[idx];
  if (!item || !item.id) return;
  btnEl.parentElement.querySelectorAll('.rating-num').forEach(function(b) { b.classList.remove('selected'); });
  btnEl.classList.add('selected');
  try {
    var r = await fetch('/api/ratings/' + item.id, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ rating: value })
    });
    if (!r.ok) {
      var errData = await r.json().catch(function() { return {}; });
      throw new Error(errData.detail || 'HTTP ' + r.status);
    }
    item.rating = value;
    var row = document.getElementById('myRatingRow' + idx);
    row.querySelector('.my-rating-value').textContent = value;
    document.getElementById('myRatingEdit' + idx).style.display = 'none';
  } catch (e) {
    console.error('saveMyRating error:', e);
    alert('Error saving rating: ' + e.message);
    btnEl.classList.remove('selected');
  }
}

async function deleteMyRating(idx) {
  var item = myRatingsData[idx];
  if (!item || !item.id) return;
  if (!confirm('Delete your ' + item.rating + '/10 rating for "' + item.title + '"?')) return;
  try {
    var r = await fetch('/api/ratings/' + item.id, {
      method: 'DELETE',
      headers: {'Content-Type': 'application/json'}
    });
    if (!r.ok) {
      var errData = await r.json().catch(function() { return {}; });
      throw new Error(errData.detail || 'HTTP ' + r.status);
    }
    myRatingsData.splice(idx, 1);
    renderMyRatings();
  } catch (e) {
    console.error('deleteMyRating error:', e);
    alert('Error deleting rating: ' + e.message);
  }
}

// Load rated keys when user changes

resetAndLoad = function() {
  ratingSynced = false;
  _origResetAndLoad();
  loadRatedKeys();
  if (document.getElementById('myRatingsPanel').style.display !== 'none') {
    loadMyRatings();
  }
};

/* ═══════════════════════════════════════════════════════════════════════
   Mark Watched + Play on Emby
   ═══════════════════════════════════════════════════════════════════════ */

async function markWatched(btnEl) {
  var data;
  try { data = JSON.parse(btnEl.getAttribute('data-mw')); } catch(e) { return; }
  if (!data || !currentUserId) return;

  btnEl.textContent = '⏳…';
  btnEl.style.pointerEvents = 'none';
  try {
    var r = await fetch('/api/mark-watched', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(Object.assign({user_id: currentUserId}, data))
    });
    if (!r.ok) {
      var err = await r.json().catch(function() { return {}; });
      throw new Error(err.detail || 'HTTP ' + r.status);
    }
    btnEl.textContent = '✓ Done';
    btnEl.classList.add('done');
    showToast('Marked as watched — synced to providers', 'ok');
    // Remove progress bar from this card
    var wrap = btnEl.closest('.thumb-wrap');
    if (wrap) {
      var pw = wrap.querySelector('.progress-wrap');
      if (pw) pw.remove();
    }
  } catch (e) {
    btnEl.textContent = '✓ Mark Watched';
    btnEl.style.pointerEvents = '';
    showToast('Error: ' + e.message, 'error');
  }
}

async function pickDeviceAndPlay(embyId, ticks) {
  if (!currentUserId) return;
  try {
    var r = await fetch('/api/remote-play/sessions/' + currentUserId);
    var d = await r.json();
    var sessions = d.sessions || [];

    if (!sessions.length) {
      showToast('No active Emby devices found', 'error');
      return;
    }

    if (sessions.length === 1) {
      await playOnDevice(embyId, sessions[0].session_id, sessions[0].device_name, ticks);
      return;
    }

    // Multiple devices — show picker modal
    var pickerHtml = '<div id="devicePicker" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;" onclick="if(event.target===this)this.remove()">';
    pickerHtml += '<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;min-width:260px;max-width:400px;">';
    pickerHtml += '<div style="font-weight:600;margin-bottom:12px;font-size:0.92rem;">Choose device</div>';
    sessions.forEach(function(s) {
      var safeName = s.device_name.replace(/'/g, "\\'");
      var label = esc(s.device_name) + (s.client ? ' (' + esc(s.client) + ')' : '') + (s.now_playing ? ' — ' + esc(s.now_playing) : '');
      pickerHtml += '<button onclick="document.getElementById(\'devicePicker\').remove();playOnDevice(\'' + embyId + '\',\'' + s.session_id + '\',\'' + safeName + '\',' + (ticks||0) + ')" style="display:block;width:100%;text-align:left;background:var(--surface-hover);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:6px;cursor:pointer;margin-bottom:6px;font-size:0.85rem;">' + label + '</button>';
    });
    pickerHtml += '<button onclick="document.getElementById(\'devicePicker\').remove()" style="display:block;width:100%;text-align:center;background:none;border:1px solid var(--border);color:var(--text-dim);padding:8px;border-radius:6px;cursor:pointer;font-size:0.82rem;margin-top:4px;">Cancel</button>';
    pickerHtml += '</div></div>';
    document.body.insertAdjacentHTML('beforeend', pickerHtml);
  } catch(e) {
    showToast('Failed to fetch devices: ' + e.message, 'error');
  }
}

async function playOnDevice(embyId, sessionId, deviceName, ticks) {
  try {
    var r = await fetch('/api/play-on-session', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user_id: currentUserId, emby_item_id: embyId, session_id: sessionId, start_position_ticks: ticks || 0}),
    });
    var d = await r.json();
    if (d.status === 'playing') {
      showToast('▶ Playing on ' + deviceName, 'ok');
    } else {
      showToast(d.message || 'Playback failed', 'error');
    }
  } catch(e) {
    showToast('Playback error: ' + e.message, 'error');
  }
}

function showToast(msg, type) {
  var existing = document.getElementById('suiteToast');
  if (existing) existing.remove();
  var bg = type === 'ok' ? 'var(--green)' : (type === 'error' ? 'var(--red)' : 'var(--accent)');
  var el = document.createElement('div');
  el.id = 'suiteToast';
  el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:' + bg + ';color:#fff;padding:10px 24px;border-radius:8px;font-size:0.85rem;font-weight:600;z-index:10000;box-shadow:0 4px 16px rgba(0,0,0,0.4);transition:opacity 0.3s;';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function() { el.style.opacity = '0'; setTimeout(function() { el.remove(); }, 300); }, 3000);
}
