<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch History - Emby-Simkl Suite</title>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-hover: #22263a;
      --border: #2a2e3e;
      --text: #e0e0e6;
      --text-dim: #8b8fa3;
      --accent: #6c5ce7;
      --accent-light: #a29bfe;
      --green: #00b894;
      --orange: #fdcb6e;
      --red: #e17055;
      --blue: #74b9ff;
      --radius: 10px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      /* Card dimensions — base for 1440px, scales via clamp */
      --card-w: clamp(240px, 23vw, 340px);
    }

    body.light-mode {
      --bg: #f5f6fa;
      --surface: #ffffff;
      --surface-hover: #f0f1f5;
      --border: #e2e4ea;
      --text: #1f2937;
      --text-dim: #6b7280;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.6;
      min-height: 100vh;
    }

    .header {
      padding: 28px 32px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }

    .container { max-width: 1200px; margin: 0 auto; padding: 28px 32px; }

    .user-select-row {
      display: flex; align-items: center; gap: 12px; margin-bottom: 24px;
    }
    .user-select-row label { font-size: 0.92rem; font-weight: 600; }
    .user-select-row select {
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      padding: 8px 14px; border-radius: 8px; font-size: 0.88rem; min-width: 180px;
    }

    .filter-bar {
      display: flex; gap: 8px; margin-bottom: 28px; flex-wrap: wrap; align-items: center;
    }
    .filter-btn {
      padding: 7px 16px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text-dim); font-size: 0.85rem;
      cursor: pointer; transition: all 0.15s; font-weight: 500;
    }
    .filter-btn:hover { background: var(--surface-hover); color: var(--text); }
    .filter-btn.active {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }

    .date-group { margin-bottom: 32px; }
    .date-label {
      font-size: 0.88rem; font-weight: 600; color: var(--text-dim);
      margin-bottom: 14px; padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .date-items {
      display: flex; gap: 14px; flex-wrap: wrap;
    }

    /* ── Card: landscape 16:9 thumbnail ── */
    .history-item {
      width: var(--card-w); cursor: default;
      background: var(--surface); border-radius: 10px;
      overflow: hidden; border: 1px solid var(--border);
    }
    .thumb-wrap {
      position: relative; width: 100%; aspect-ratio: 16 / 9;
      overflow: hidden;
      background: var(--surface);
    }
    .thumb-wrap img {
      width: 100%; height: 100%; object-fit: cover;
      display: block; opacity: 0; transition: opacity 0.25s;
    }
    .thumb-wrap img.loaded { opacity: 1; }
    .thumb-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; color: var(--text-dim); background: var(--surface);
      flex-direction: column; gap: 6px; padding: 12px; text-align: center;
    }
    .thumb-placeholder .ph-title {
      font-size: 0.78rem; color: var(--text-dim); line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; word-break: break-word;
    }
    .play-count-badge {
      position: absolute; top: 6px; right: 6px;
      background: var(--accent); color: #fff;
      font-size: 0.72rem; font-weight: 700;
      padding: 2px 7px; border-radius: 5px;
      line-height: 1.3;
    }

    /* ── Progress bar + time remaining ── */
    .progress-wrap {
      position: absolute; bottom: 0; left: 0; right: 0;
    }
    .progress-time {
      font-size: 0.68rem; font-weight: 600; color: #fff;
      padding: 2px 8px; text-align: right;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .progress-track {
      height: 4px; background: rgba(255,255,255,0.2);
    }
    .progress-fill {
      height: 100%; background: var(--orange);
    }

    .item-title {
      margin: 0; padding: 8px 10px 0; font-size: 0.82rem; color: var(--text);
      line-height: 1.35; overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
    }
    .item-subtitle {
      font-size: 0.74rem; color: var(--text-dim); padding: 2px 10px 8px;
    }

    .loading { text-align: center; padding: 48px 0; color: var(--text-dim); font-size: 0.92rem; }
    .load-more-wrap { text-align: center; padding: 20px 0; }
    .load-more-btn {
      padding: 10px 28px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font-size: 0.88rem;
      cursor: pointer; transition: all 0.15s; font-weight: 500;
    }
    .load-more-btn:hover { background: var(--surface-hover); }
    .load-more-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .theme-toggle {
      margin-left: auto; padding: 6px 14px; border-radius: 8px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text-dim); cursor: pointer; font-size: 0.82rem;
    }
    .theme-toggle:hover { background: var(--surface-hover); }

    /* ── My Ratings Panel ── */
    .my-ratings-list { display: flex; flex-direction: column; gap: 8px; }
    .my-rating-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface); border-radius: 8px; padding: 8px 12px;
    }
    .my-rating-poster {
      width: 45px; height: 65px; border-radius: 4px; object-fit: cover; flex-shrink: 0;
    }
    .my-rating-poster-ph {
      width: 45px; height: 65px; border-radius: 4px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; background: var(--card-bg);
    }
    .my-rating-info { flex: 1; min-width: 0; }
    .my-rating-title {
      font-size: 0.85rem; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .my-rating-meta { font-size: 0.72rem; color: var(--text-dim); }
    .my-rating-value {
      font-size: 1.3rem; font-weight: 800; color: var(--accent);
      min-width: 30px; text-align: center;
    }
    .my-rating-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .my-rating-actions button {
      background: var(--card-bg); border: 1px solid var(--border); color: var(--text-dim);
      width: 28px; height: 28px; border-radius: 6px; cursor: pointer;
      font-size: 0.75rem; display: flex; align-items: center; justify-content: center;
    }
    .my-rating-actions button:hover { background: var(--surface-hover); color: var(--text); }
    .my-rating-actions button.delete:hover { background: var(--red); color: #fff; }
    .my-rating-edit-row {
      display: flex; gap: 3px; align-items: center; margin-top: 4px;
    }
    .my-rating-edit-row .rating-num {
      width: 24px; height: 24px;
    }
    .my-ratings-empty { padding: 30px; text-align: center; color: var(--text-dim); }
    .my-ratings-source-filter {
      display: flex; gap: 6px; margin-bottom: 12px;
    }
    .my-ratings-source-filter button {
      background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
      padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 0.78rem;
    }
    .my-ratings-source-filter button.active {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }

    /* ── Hover-to-Rate Overlay ── */
    .rated-badge {
      position: absolute; top: 6px; left: 6px; z-index: 4;
      background: var(--green, #00b894); color: #fff;
      font-size: 0.72rem; font-weight: 800; min-width: 22px; height: 22px;
      border-radius: 5px; display: flex; align-items: center; justify-content: center;
      padding: 0 5px; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      line-height: 1;
    }
    .hover-rate-overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.85) 30%);
      padding: 22px 6px 6px; display: flex; justify-content: center; gap: 2px;
      opacity: 0; transition: opacity 0.2s ease; pointer-events: none;
      z-index: 5;
    }
    .thumb-wrap:hover .hover-rate-overlay { opacity: 1; pointer-events: auto; }
    .hover-rate-btn {
      width: 20px; height: 20px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.1); color: #fff; font-size: 0.65rem;
      font-weight: 700; cursor: pointer; display: flex; align-items: center;
      justify-content: center; transition: all 0.1s; padding: 0;
    }
    .hover-rate-btn:hover { background: var(--accent); border-color: var(--accent); transform: scale(1.15); }
    .hover-rate-btn.rated-ok { background: var(--green); border-color: var(--green); pointer-events: none; }
    .hover-rated-msg {
      position: absolute; bottom: 6px; left: 0; right: 0;
      text-align: center; color: var(--green); font-size: 0.75rem; font-weight: 700;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }
    /* rating-num reused in My Ratings edit row */
    .rating-num {
      width: 24px; height: 24px; border-radius: 4px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text-dim); font-size: 0.7rem;
      font-weight: 700; cursor: pointer; display: flex; align-items: center;
      justify-content: center; transition: all 0.12s;
    }
    .rating-num:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .rating-num.selected { background: var(--green); color: #fff; border-color: var(--green); }
  </style>
<script src="/static/js/csrf.js"></script>

<script>
function esc(s) { if (!s && s !== 0) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

let currentUserId = null;
let currentFilter = 'all';
let nextBefore = null;
let isLoading = false;

function toggleSuiteTheme() {
  document.body.classList.toggle('light-mode');
  const isLight = document.body.classList.contains('light-mode');
  localStorage.setItem('suite-theme', isLight ? 'light' : 'dark');
}

function setFilter(type, btn) {
  currentFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  resetAndLoad();
}

function resetAndLoad() {
  currentUserId = parseInt(document.getElementById('userSelect').value);
  if (!currentUserId) return;
  nextBefore = null;
  document.getElementById('timeline').innerHTML = '';
  loadHistory();
}

function imgUrl(embyId, imageType) {
  if (!embyId) return '';
  return '/api/emby/image/' + embyId + '/' + imageType + '?maxWidth=400';
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}

function formatTimeLeft(runtimeMin, progress) {
  if (!runtimeMin || progress == null) return '';
  const left = Math.round(runtimeMin * (100 - progress) / 100);
  if (left >= 60) {
    const h = Math.floor(left / 60);
    const m = left % 60;
    return h + 'h ' + m + 'm left';
  }
  return left + ' min left';
}

function itemLabel(item) {
  const sn = item.season_number != null ? String(item.season_number).padStart(2, '0') : null;
  const en = item.episode_number != null ? String(item.episode_number).padStart(2, '0') : null;

  if (item.item_type === 'show') {
    const series = item.series_name || item.title || '';
    const epCount = item.play_count || 1;
    const sub = epCount === 1 ? '1 episode' : epCount + ' episodes';
    return { title: series, sub: sub };
  }
  if (item.item_type === 'episode') {
    const series = item.series_name || '';
    const epCode = (sn && en) ? ('S' + sn + ' E' + en) : '';
    const displayTitle = series || item.title || '';
    const sub = epCode ? (series ? series + ' ' + epCode : epCode) : series;
    return { title: displayTitle, sub: sub };
  }
  return { title: item.title || '', sub: 'Movie' };
}

function renderItem(item) {
  const label = itemLabel(item);
  if (!label.title) return '';

  // Movies use Thumb, episodes/shows use Primary
  const imgType = item.item_type === 'movie' ? 'Thumb' : 'Primary';
  const effectiveId = item.emby_id || (item.item_type === 'episode' ? item.series_emby_id : null);
  const url = imgUrl(effectiveId, imgType);
  // Fallback chain: movie Thumb→Primary, episode Primary→series Primary
  let fallbackUrl = '';
  if (item.item_type === 'movie') {
    fallbackUrl = imgUrl(item.emby_id, 'Primary');
  } else if (item.item_type === 'episode' && item.emby_id && item.series_emby_id) {
    fallbackUrl = imgUrl(item.series_emby_id, 'Primary');
  }

  const badge = (item.item_type === 'show')
    ? '' // show mode uses play_count as episode count in subtitle, not badge
    : (item.play_count > 1 ? '<span class="play-count-badge">' + item.play_count + '\u00d7</span>' : '');
  const icon = item.item_type === 'movie' ? '🎬' : '📺';
  const phTitle = esc(label.title);

  // Progress bar + time remaining for partial watches
  let progressHtml = '';
  const prog = item.progress;
  if (prog !== null && prog !== undefined && prog < 95) {
    const timeLeft = formatTimeLeft(item.runtime_minutes, prog);
    const timeLabel = timeLeft || (prog + '%');
    progressHtml = '<div class="progress-wrap">'
                 + '<div class="progress-time">' + timeLabel + '</div>'
                 + '<div class="progress-track"><div class="progress-fill" style="width:' + prog + '%"></div></div>'
                 + '</div>';
  }

  // Build data attributes for post-render badge application
  const itemImdb = item.imdb_id || '';
  const itemTitle = (item.series_name || item.title || '').trim();
  const isEpisode = item.item_type === 'episode';
  const itemType = isEpisode ? 'episode' : (item.item_type === 'show' ? 'show' : 'movie');
  const sNum = item.season_number != null ? item.season_number : '';
  const eNum = item.episode_number != null ? item.episode_number : '';
  // For episodes: badge key includes S/E so each episode is independent
  const badgeKey = isEpisode && sNum !== '' && eNum !== ''
    ? 'ep:' + itemTitle.toLowerCase() + ':s' + sNum + 'e' + eNum
    : (itemImdb ? 'imdb:' + itemImdb : 'title:' + itemTitle.toLowerCase());
  const dataAttrs = ' data-imdb="' + esc(itemImdb) + '" data-ratetitle="' + esc(itemTitle.toLowerCase()) + '" data-ratetype="' + esc(itemType) + '"'
    + ' data-tmdb="' + esc(item.tmdb_id || '') + '"'
    + ' data-badgekey="' + esc(badgeKey) + '"'
    + ' data-season="' + esc(String(sNum)) + '" data-episode="' + esc(String(eNum)) + '"'
    + ' data-seriesname="' + esc(item.series_name || '') + '"';

  let imgHtml;
  if (url) {
    const fbAttr = fallbackUrl ? ' data-fallback="' + esc(fallbackUrl) + '"' : '';
    imgHtml = '<img data-src="' + esc(url) + '"' + fbAttr + ' alt="' + phTitle + '">'
            + '<div class="thumb-placeholder">'
            + '<span>' + icon + '</span>'
            + '<span class="ph-title">' + phTitle + '</span></div>';
  } else {
    imgHtml = '<div class="thumb-placeholder">'
            + '<span>' + icon + '</span>'
            + '<span class="ph-title">' + phTitle + '</span></div>';
  }

  return '<div class="history-item">'
    + '<div class="thumb-wrap"' + dataAttrs + '>' + imgHtml + badge + progressHtml + '</div>'
    + '<div class="item-title">' + esc(label.title) + '</div>'
    + '<div class="item-subtitle">' + esc(label.sub) + '</div>'
    + '</div>';
}

function renderDay(day) {
  const itemsHtml = day.items.map(renderItem).filter(Boolean).join('');
  if (!itemsHtml) return '';
  return '<div class="date-group">'
    + '<div class="date-label">' + esc(formatDate(day.date)) + '</div>'
    + '<div class="date-items">' + itemsHtml + '</div>'
    + '</div>';
}

/* ── IntersectionObserver: lazy-load images ── */
const imgObserver = new IntersectionObserver(function(entries) {
  for (const entry of entries) {
    if (entry.isIntersecting) {
      const img = entry.target;
      const src = img.getAttribute('data-src');
      if (src) {
        img.removeAttribute('data-src');
        img.onload = function() {
          this.classList.add('loaded');
          const ph = this.parentElement.querySelector('.thumb-placeholder');
          if (ph) ph.style.display = 'none';
        };
        img.onerror = function() {
          // Try fallback (movie Thumb → Primary)
          const fb = this.getAttribute('data-fallback');
          if (fb) {
            this.removeAttribute('data-fallback');
            this.src = fb;
          } else {
            this.style.display = 'none';
          }
        };
        img.src = src;
      }
      imgObserver.unobserve(img);
    }
  }
}, { rootMargin: '200px' });

function observeNewImages() {
  document.querySelectorAll('.thumb-wrap img[data-src]').forEach(function(img) {
    imgObserver.observe(img);
  });
}

async function loadHistory() {
  if (isLoading || !currentUserId) return;
  isLoading = true;
  var loadingEl = document.getElementById('loadingMsg');
  var loadMoreWrap = document.getElementById('loadMoreWrap');
  var btn = document.getElementById('loadMoreBtn');

  if (!nextBefore) {
    loadingEl.textContent = 'Loading history\u2026';
    loadingEl.style.display = 'block';
  }
  btn.disabled = true;
  btn.textContent = 'Loading\u2026';

  try {
    var url = '/api/watch-history/' + currentUserId + '/by-date?days=30';
    if (nextBefore) url += '&before=' + nextBefore;
    if (currentFilter === 'movie') url += '&item_type=movie';
    else if (currentFilter === 'show') url += '&item_type=show';
    else if (currentFilter === 'episode') url += '&item_type=episode';

    var r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var data = await r.json();

    nextBefore = data.next_before;

    var timeline = document.getElementById('timeline');

    for (var i = 0; i < data.days.length; i++) {
      var html = renderDay(data.days[i]);
      if (html) timeline.insertAdjacentHTML('beforeend', html);
    }

    observeNewImages();
    if (ratedKeys.size > 0) applyRatingBadges();

    loadingEl.style.display = 'none';
    loadMoreWrap.style.display = nextBefore ? 'block' : 'none';
    btn.disabled = false;
    btn.textContent = 'Load more';

    if (data.days.length === 0 && !nextBefore && !timeline.innerHTML.trim()) {
      loadingEl.textContent = 'No watch history found.';
      loadingEl.style.display = 'block';
    }

  } catch (e) {
    console.error(e);
    loadingEl.textContent = 'Error: ' + e.message;
    loadingEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Retry';
  }
  isLoading = false;
}

function loadMore() { loadHistory(); }

async function loadUsers() {
  try {
    var r = await fetch('/auth/users');
    var users = await r.json();
    var linked = users.filter(function(u) { return u.linked; });
    var sel = document.getElementById('userSelect');
    sel.innerHTML = linked.map(function(u) {
      return '<option value="' + u.id + '">' + esc(u.emby_username || u.emby_user_id) + '</option>';
    }).join('');
    if (linked.length > 0) {
      sel.value = linked[0].id;
      resetAndLoad();
    }
  } catch(e) { console.error(e); }
}

loadUsers();


/* ═══════════════════════════════════════════════════════════════════════
   Hover-to-Rate System
   ═══════════════════════════════════════════════════════════════════════ */

let ratedKeys = new Map();
let ratingSynced = false;


async function syncRatingsOnce() {
  if (ratingSynced || !currentUserId) return;
  ratingSynced = true;
  try {
    await fetch('/api/ratings/sync/' + currentUserId, {
      method: 'POST', headers: {'Content-Type': 'application/json'}
    });
  } catch (e) { console.error('syncRatings error:', e); }
}

async function loadRatedKeys() {
  if (!currentUserId) return;
  await syncRatingsOnce();
  try {
    var r = await fetch('/api/ratings/user/' + currentUserId + '?limit=50000');
    if (!r.ok) return;
    var data = await r.json();
    ratedKeys = new Map();
    (data.items || []).forEach(function(item) {
      // Episode-level key: ep:seriesname:s1e2
      if (item.item_type === 'episode' && item.series_name && item.season_number != null && item.episode_number != null) {
        var epKey = 'ep:' + item.series_name.trim().toLowerCase() + ':s' + item.season_number + 'e' + item.episode_number;
        ratedKeys.set(epKey, item.rating);
      }
      // Also store by imdb and title for show/movie level
      if (item.imdb_id) ratedKeys.set('imdb:' + item.imdb_id, item.rating);
      if (item.title) ratedKeys.set('title:' + item.title.trim().toLowerCase(), item.rating);
    });
    // Apply badges to any already-rendered items
    applyRatingBadges();
  } catch (e) { console.error('loadRatedKeys error:', e); }
}

function applyRatingBadges() {
  if (ratedKeys.size === 0) return; // No data yet, wait
  document.querySelectorAll('.thumb-wrap[data-badgekey]').forEach(function(wrap) {
    // Remove any existing badge/overlay to re-apply fresh
    var old = wrap.querySelector('.rated-badge');
    if (old) old.remove();
    var oldOverlay = wrap.querySelector('.hover-rate-overlay');
    if (oldOverlay) oldOverlay.remove();

    var badgeKey = wrap.getAttribute('data-badgekey');
    var imdb = wrap.getAttribute('data-imdb');
    var title = wrap.getAttribute('data-ratetitle');
    var tmdb = wrap.getAttribute('data-tmdb');
    var itemType = wrap.getAttribute('data-ratetype') || 'movie';
    var season = wrap.getAttribute('data-season');
    var episode = wrap.getAttribute('data-episode');
    var seriesName = wrap.getAttribute('data-seriesname');

    // Check if rated — use badge key first, then fallbacks
    var rating = ratedKeys.get(badgeKey);
    if (rating === undefined && imdb) rating = ratedKeys.get('imdb:' + imdb);
    if (rating === undefined && title) rating = ratedKeys.get('title:' + title);

    if (rating !== undefined) {
      var badge = document.createElement('div');
      badge.className = 'rated-badge';
      badge.textContent = rating;
      wrap.appendChild(badge);
    } else if (imdb || title) {
      // Add hover-to-rate overlay for unrated items
      var itemJson = JSON.stringify({
        imdb_id: imdb || null,
        tmdb_id: tmdb || null,
        title: (itemType === 'episode' ? (seriesName || title) : title) || '',
        item_type: itemType,
        season_number: season ? parseInt(season) : null,
        episode_number: episode ? parseInt(episode) : null,
        series_name: seriesName || '',
      });
      var overlay = document.createElement('div');
      overlay.className = 'hover-rate-overlay';
      var btns = '';
      for (var n = 1; n <= 10; n++) {
        btns += '<button class="hover-rate-btn" onclick="event.stopPropagation();hoverRate(this,' + n + ')" data-item=\'' + itemJson.replace(/'/g, '&#39;') + '\'>' + n + '</button>';
      }
      overlay.innerHTML = btns;
      wrap.appendChild(overlay);
    }
  });
}

async function hoverRate(btnEl, value) {
  var itemData;
  try { itemData = JSON.parse(btnEl.getAttribute('data-item')); } catch(e) { return; }
  if (!itemData) return;

  var overlay = btnEl.parentElement;
  overlay.querySelectorAll('.hover-rate-btn').forEach(function(b) { b.style.opacity = '0.4'; });
  btnEl.style.opacity = '1';
  btnEl.classList.add('rated-ok');

  try {
    var r = await fetch('/api/rate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        user_id: currentUserId,
        imdb_id: itemData.imdb_id || null,
        tmdb_id: itemData.tmdb_id || null,
        rating: value,
        item_type: itemData.item_type,
        title: itemData.title,
        season_number: itemData.season_number || null,
        episode_number: itemData.episode_number || null,
        series_name: itemData.series_name || ''
      })
    });
    if (!r.ok) {
      var errData = await r.json().catch(function() { return {}; });
      throw new Error(errData.detail || 'HTTP ' + r.status);
    }
    // Store rated key at correct level
    var key;
    if (itemData.item_type === 'episode' && itemData.series_name && itemData.season_number && itemData.episode_number) {
      key = 'ep:' + itemData.series_name.trim().toLowerCase() + ':s' + itemData.season_number + 'e' + itemData.episode_number;
    } else {
      key = itemData.imdb_id ? 'imdb:' + itemData.imdb_id : 'title:' + itemData.title.trim().toLowerCase();
    }
    ratedKeys.set(key, value);
    overlay.innerHTML = '<div class="hover-rated-msg">\u2713 ' + value + '/10</div>';
  } catch (e) {
    console.error('hoverRate error:', e);
    overlay.querySelectorAll('.hover-rate-btn').forEach(function(b) { b.style.opacity = ''; });
    btnEl.classList.remove('rated-ok');
    overlay.insertAdjacentHTML('beforeend', '<div class="hover-rated-msg" style="color:var(--red)">\u2717 ' + (e.message || 'Error').substring(0, 40) + '</div>');
    setTimeout(function() {
      var msg = overlay.querySelector('.hover-rated-msg');
      if (msg) msg.remove();
    }, 3000);
  }
}

// ═══════════════════════════════════════════════════════════════════════
// My Ratings Panel
// ═══════════════════════════════════════════════════════════════════════

let myRatingsSource = 'user';
let myRatingsData = [];

function showMyRatings(btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('timeline').style.display = 'none';
  document.getElementById('loadMoreWrap').style.display = 'none';
  document.getElementById('myRatingsPanel').style.display = 'block';
  loadMyRatings();
}

function setFilter_orig(type, btn) {
  // Restore timeline when switching back from My Ratings
  document.getElementById('myRatingsPanel').style.display = 'none';
  document.getElementById('timeline').style.display = '';
}

// Monkey-patch setFilter to also hide My Ratings panel
var _origSetFilter = setFilter;
setFilter = function(type, btn) {
  document.getElementById('myRatingsPanel').style.display = 'none';
  document.getElementById('timeline').style.display = '';
  _origSetFilter(type, btn);
};

async function loadMyRatings() {
  if (!currentUserId) return;
  var panel = document.getElementById('myRatingsPanel');
  panel.innerHTML = '<div class="loading">Loading ratings…</div>';
  try {
    var url = '/api/ratings/user/' + currentUserId + '?limit=200';
    if (myRatingsSource) url += '&source=' + myRatingsSource;
    var r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var data = await r.json();
    myRatingsData = data.items || [];
    renderMyRatings();
  } catch (e) {
    panel.innerHTML = '<div class="my-ratings-empty">Error loading ratings: ' + esc(e.message) + '</div>';
  }
}

function renderMyRatings() {
  var panel = document.getElementById('myRatingsPanel');
  var filterHtml = '<div class="my-ratings-source-filter">'
    + '<button class="' + (myRatingsSource === 'user' ? 'active' : '') + '" onclick="setRatingSource(\'user\')">My Ratings</button>'
    + '<button class="' + (myRatingsSource === '' ? 'active' : '') + '" onclick="setRatingSource(\'\')">All Ratings</button>'
    + '<button class="' + (myRatingsSource === 'imported' ? 'active' : '') + '" onclick="setRatingSource(\'imported\')">Imported</button>'
    + '</div>';

  if (!myRatingsData.length) {
    panel.innerHTML = filterHtml + '<div class="my-ratings-empty">No ratings found.</div>';
    return;
  }

  var rows = myRatingsData.map(function(item, idx) {
    var posterHtml;
    var posterId = item.emby_id || item.series_emby_id;
    var posterEmoji = item.item_type === 'episode' ? '📺' : (item.item_type === 'show' ? '📺' : '🎬');
    if (posterId) {
      posterHtml = '<img class="my-rating-poster" src="' + esc(imgUrl(posterId, 'Primary'))
                 + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
                 + '<div class="my-rating-poster-ph" style="display:none">'
                 + posterEmoji + '</div>';
    } else {
      posterHtml = '<div class="my-rating-poster-ph">'
                 + posterEmoji + '</div>';
    }
    var meta = '';
    if (item.item_type === 'episode') {
      meta = 'Episode';
      if (item.season_number != null && item.episode_number != null) {
        meta += ' · S' + String(item.season_number).padStart(2, '0') + 'E' + String(item.episode_number).padStart(2, '0');
      }
    } else if (item.item_type === 'show') {
      meta = 'Show';
    } else {
      meta = 'Movie';
    }
    if (item.rated_at) {
      var d = new Date(item.rated_at);
      meta += ' · ' + d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }
    if (item.source === 'imported') meta += ' · imported';

    var actions = '';
    if (item.source === 'user') {
      actions = '<div class="my-rating-actions">'
        + '<button onclick="editMyRating(' + idx + ')" title="Edit">✏️</button>'
        + '<button class="delete" onclick="deleteMyRating(' + idx + ')" title="Delete">🗑️</button>'
        + '</div>';
    }

      var displayTitle = item.series_name || item.title;
      return '<div class="my-rating-row" id="myRatingRow' + idx + '">'
      + posterHtml
      + '<div class="my-rating-info">'
      + '<div class="my-rating-title" title="' + esc(displayTitle) + '">' + esc(displayTitle) + '</div>'
      + '<div class="my-rating-meta">' + esc(meta) + '</div>'
      + '<div class="my-rating-edit-row" id="myRatingEdit' + idx + '" style="display:none"></div>'
      + '</div>'
      + '<div class="my-rating-value">' + item.rating + '</div>'
      + actions
      + '</div>';
  }).join('');

  panel.innerHTML = filterHtml + '<div class="my-ratings-list">' + rows + '</div>';
}

function setRatingSource(src) {
  myRatingsSource = src;
  loadMyRatings();
}

function editMyRating(idx) {
  var item = myRatingsData[idx];
  if (!item) return;
  var editRow = document.getElementById('myRatingEdit' + idx);
  if (editRow.style.display !== 'none') {
    editRow.style.display = 'none';
    return;
  }
  var nums = '';
  for (var n = 1; n <= 10; n++) {
    var sel = (n === item.rating) ? ' selected' : '';
    nums += '<button class="rating-num' + sel + '" onclick="saveMyRating(' + idx + ',' + n + ',this)">' + n + '</button>';
  }
  editRow.innerHTML = nums;
  editRow.style.display = 'flex';
}

async function saveMyRating(idx, value, btnEl) {
  var item = myRatingsData[idx];
  if (!item || !item.id) return;
  btnEl.parentElement.querySelectorAll('.rating-num').forEach(function(b) { b.classList.remove('selected'); });
  btnEl.classList.add('selected');
  try {
    var r = await fetch('/api/ratings/' + item.id, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ rating: value })
    });
    if (!r.ok) {
      var errData = await r.json().catch(function() { return {}; });
      throw new Error(errData.detail || 'HTTP ' + r.status);
    }
    item.rating = value;
    // Update display
    var row = document.getElementById('myRatingRow' + idx);
    row.querySelector('.my-rating-value').textContent = value;
    document.getElementById('myRatingEdit' + idx).style.display = 'none';
  } catch (e) {
    console.error('saveMyRating error:', e);
    alert('Error saving rating: ' + e.message);
    btnEl.classList.remove('selected');
  }
}

async function deleteMyRating(idx) {
  var item = myRatingsData[idx];
  if (!item || !item.id) return;
  if (!confirm('Delete your ' + item.rating + '/10 rating for "' + item.title + '"?')) return;
  try {
    var r = await fetch('/api/ratings/' + item.id, {
      method: 'DELETE',
      headers: {'Content-Type': 'application/json'}
    });
    if (!r.ok) {
      var errData = await r.json().catch(function() { return {}; });
      throw new Error(errData.detail || 'HTTP ' + r.status);
    }
    myRatingsData.splice(idx, 1);
    renderMyRatings();
  } catch (e) {
    console.error('deleteMyRating error:', e);
    alert('Error deleting rating: ' + e.message);
  }
}

// Load rated keys when user changes or page first loads
var _origResetAndLoad = resetAndLoad;
resetAndLoad = function() {
  ratingSynced = false;
  _origResetAndLoad();
  loadRatedKeys();
  // If My Ratings tab was active, refresh it
  if (document.getElementById('myRatingsPanel').style.display !== 'none') {
    loadMyRatings();
  }
};
</script>
