<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duplicate &amp; Conflict Detector — Emby-Simkl Suite</title>
<style>
  :root {
    --bg: #0D0F14;
    --surface: #151820;
    --surface-hover: #1C2030;
    --border: #222838;
    --text: #E6EDF3;
    --text-dim: #7D8590;
    --accent: #7B68EE;
    --accent-light: #9585F0;
    --green: #4AAD6E;
    --orange: #D29922;
    --red: #E05252;
    --blue: #7B8CDE;
    --radius: 10px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
  .container { max-width: 1000px; margin: 0 auto; padding: 28px 20px; }
  h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 8px; }
  .subtitle { color: var(--text-dim); font-size: 0.88rem; margin-bottom: 20px; }
  .btn { padding: 10px 20px; border: none; border-radius: var(--radius); cursor: pointer; font-weight: 600; font-size: 0.88rem; }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-accent:hover { opacity: 0.9; }
  .btn-accent:disabled { opacity: 0.5; cursor: not-allowed; }
  .stats-row { display: flex; gap: 12px; margin: 20px 0; flex-wrap: wrap; }
  .stat-card {
    padding: 14px 18px; background: var(--surface); border-radius: var(--radius);
    border: 1px solid var(--border); flex: 1; min-width: 120px; text-align: center;
  }
  .stat-val { font-size: 1.5rem; font-weight: 700; }
  .stat-label { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }
  .issue-list { display: flex; flex-direction: column; gap: 10px; }
  .issue-card {
    padding: 14px 18px; background: var(--surface); border-radius: var(--radius);
    border: 1px solid var(--border); display: flex; align-items: center; gap: 14px;
  }
  .issue-card:hover { border-color: var(--accent); }
  .severity-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .severity-dot.warning { background: var(--orange); }
  .severity-dot.info { background: var(--blue); }
  .severity-dot.error { background: var(--red); }
  .issue-body { flex: 1; min-width: 0; }
  .issue-title { font-weight: 600; font-size: 0.92rem; }
  .issue-detail { color: var(--text-dim); font-size: 0.82rem; margin-top: 2px; }
  .issue-type {
    font-size: 0.7rem; font-weight: 600; padding: 2px 8px; border-radius: 4px;
    white-space: nowrap; flex-shrink: 0;
  }
  .type-duplicate { background: rgba(210,169,34,0.15); color: var(--orange); }
  .type-orphaned { background: rgba(123,140,222,0.15); color: var(--blue); }
  .type-metadata { background: rgba(224,82,82,0.15); color: var(--red); }
  .item-type-badge {
    font-size: 0.65rem; font-weight: 600; padding: 1px 6px; border-radius: 4px;
    margin-left: 6px; vertical-align: middle;
  }
  .badge-movie { background: rgba(123,104,238,0.15); color: var(--accent); }
  .badge-episode { background: rgba(123,140,222,0.15); color: var(--blue); }
  .loading { text-align: center; color: var(--text-dim); padding: 40px; }
  .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; color: var(--text-dim); padding: 40px; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-btn {
    padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: transparent; color: var(--text-dim); cursor: pointer; font-size: 0.82rem;
  }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .imdb-link { color: var(--accent-light); text-decoration: none; font-size: 0.78rem; }
  .imdb-link:hover { text-decoration: underline; }
  a { color: inherit; text-decoration: none; }
  .dup-sub { font-size: 0.78rem; color: var(--text-dim); margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; }
  .dup-lib {
    display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.72rem; font-weight: 600;
    background: rgba(123,104,238,0.12); color: var(--accent-light); border: 1px solid rgba(123,104,238,0.2);
  }
</style>
</head>
<body>
<nav class="suite-nav" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#0D0F14;border-bottom:1px solid #222838;padding:10px 24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <span style="color:#7D8590;font-size:0.85rem;font-weight:700;letter-spacing:0.5px;margin-right:10px;">EMBY-SIMKL SUITE</span>
    <a href="/" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">Dashboard</a>
    <a href="/lists" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">📋 Lists</a>
    <a href="/predictions" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">🤖 Predictions</a>
    <a href="/bias" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">🎓 Taste Profile</a>
    <a href="/rewatch" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">🔁 Rewatch</a>
    <a href="/stats" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">📊 Stats</a>
    <a href="/watch-history" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">📜 History</a>
    <a href="/library-health" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">🏥 Health</a>
    <a href="/watch-party" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">👥 Watch Party</a>
    <a href="/filmography" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">🎬 Filmography</a>
    <a href="/duplicates" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:#1C2030;color:#ffffff;font-weight:600;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='#1C2030'">🔍 Duplicates</a>
    <a href="/settings" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">⚙️ Settings</a>
    <a href="/guide" style="color:#E6EDF3;text-decoration:none;font-size:0.9rem;padding:7px 12px;border-radius:6px;background:transparent;" onmouseover="this.style.background='#1C2030'" onmouseout="this.style.background='transparent'">📖 Guide</a>
</nav>
<div class="container">
  <h1>🔍 Duplicate &amp; Conflict Detector</h1>
  <p class="subtitle">Scans your library and watch history for duplicates, orphaned entries, and missing metadata.</p>
  <button class="btn btn-accent" id="scanBtn" onclick="runScan()">🔍 Run Scan</button>
  <div id="results"></div>
</div>
<script>
var allIssues = [];

async function runScan() {
  var btn = document.getElementById('scanBtn');
  btn.disabled = true; btn.textContent = '⏳ Scanning…';
  var el = document.getElementById('results');
  el.innerHTML = '<div class="loading"><div class="spinner"></div> Scanning library and watch history…</div>';
  try {
    var r = await fetch('/api/duplicates/scan');
    var data = await r.json();
    allIssues = data.issues || [];
    renderStats(data);
    renderIssues('all');
  } catch(e) {
    el.innerHTML = '<div class="empty">Error: ' + e.message + '</div>';
  } finally {
    btn.disabled = false; btn.textContent = '🔍 Run Scan';
  }
}

function renderStats(data) {
  var el = document.getElementById('results');
  var html = '<div class="stats-row">';
  html += '<div class="stat-card"><div class="stat-val" style="color:var(--accent);">' + data.total + '</div><div class="stat-label">Total Issues</div></div>';
  html += '<div class="stat-card"><div class="stat-val" style="color:var(--orange);">' + data.duplicates + '</div><div class="stat-label">Duplicates</div></div>';
  html += '<div class="stat-card"><div class="stat-val" style="color:var(--blue);">' + data.orphaned + '</div><div class="stat-label">Orphaned</div></div>';
  html += '<div class="stat-card"><div class="stat-val" style="color:var(--red);">' + data.missing_meta + '</div><div class="stat-label">Missing Metadata</div></div>';
  html += '</div>';

  html += '<div class="filter-row">';
  html += '<button class="filter-btn active" onclick="filterIssues(this,\'all\')">All (' + data.total + ')</button>';
  if (data.duplicates) html += '<button class="filter-btn" onclick="filterIssues(this,\'duplicate_library\')">Duplicates (' + data.duplicates + ')</button>';
  if (data.orphaned) html += '<button class="filter-btn" onclick="filterIssues(this,\'orphaned_history\')">Orphaned (' + data.orphaned + ')</button>';
  if (data.missing_meta) html += '<button class="filter-btn" onclick="filterIssues(this,\'missing_metadata\')">Missing Meta (' + data.missing_meta + ')</button>';
  html += '</div>';
  html += '<div id="issueList" class="issue-list"></div>';
  el.innerHTML = html;
}

function filterIssues(btn, type) {
  document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  renderIssues(type);
}

function renderIssues(type) {
  var filtered = type === 'all' ? allIssues : allIssues.filter(function(i) { return i.type === type; });
  var el = document.getElementById('issueList');
  if (!filtered.length) { el.innerHTML = '<div class="empty">No issues found — your library looks clean!</div>'; return; }

  var html = '';
  filtered.forEach(function(issue) {
    var typeLabel = issue.type === 'duplicate_library' ? 'Duplicate' : issue.type === 'orphaned_history' ? 'Orphaned' : 'No Metadata';
    var typeClass = issue.type === 'duplicate_library' ? 'type-duplicate' : issue.type === 'orphaned_history' ? 'type-orphaned' : 'type-metadata';

    var typeBadge = '';
    if (issue.item_type === 'movie') typeBadge = '<span class="item-type-badge badge-movie">Movie</span>';
    else if (issue.item_type === 'episode') typeBadge = '<span class="item-type-badge badge-episode">Series</span>';

    html += '<div class="issue-card">';
    html += '<div class="severity-dot ' + issue.severity + '"></div>';
    html += '<div class="issue-body">';
    html += '<div class="issue-title">' + esc(issue.title) + typeBadge + '</div>';

    /* For duplicates, show which library each copy is in */
    if (issue.type === 'duplicate_library' && issue.items && issue.items.length > 1) {
      html += '<div class="dup-sub">';
      issue.items.forEach(function(it) {
        html += '<span class="dup-lib">' + esc(it.library || 'Unknown library') + '</span>';
      });
      html += '</div>';
    } else {
      html += '<div class="issue-detail">' + esc(issue.details) + '</div>';
    }

    if (issue.imdb_id) html += '<a class="imdb-link" href="/item/' + issue.imdb_id + '">View details →</a>';
    html += '</div>';
    html += '<span class="issue-type ' + typeClass + '">' + typeLabel + '</span>';
    html += '</div>';
  });
  el.innerHTML = html;
}

function esc(s) { if (!s && s !== 0) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
</body>
</html>
