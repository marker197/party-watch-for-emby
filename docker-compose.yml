version: "3.8"

services:
  emby-simkl-suite:
    build: .
    container_name: emby-simkl-suite
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    environment:
      # Infrastructure — baked defaults, no .env needed
      DATABASE_URL: postgresql+asyncpg://embysimkl:embysimkl-internal-only@postgres:5432/embysimkl
      DB_USER: embysimkl
      DB_PASSWORD: embysimkl-internal-only
      DB_NAME: embysimkl
      REDIS_URL: redis://redis:6379/0

      # Emby + integrations — leave blank, collected via setup wizard
      EMBY_URL: ${EMBY_URL:-}
      EMBY_API_KEY: ${EMBY_API_KEY:-}
      SIMKL_CLIENT_ID: ${SIMKL_CLIENT_ID:-}
      MDBLIST_CLIENT_ID: ${MDBLIST_CLIENT_ID:-}
      MDBLIST_CLIENT_SECRET: ${MDBLIST_CLIENT_SECRET:-}

      # JWT — auto-generated on first run if not set
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}

      # Optional overrides (uncomment to customise)
      # LOG_LEVEL: INFO
      # ALLOWED_ORIGINS: http://192.168.1.92:8000
      # SSL_DOMAIN: your.domain.com
      # ENABLE_SMART_QUEUE: "true"
      # ENABLE_ML_PREDICTOR: "true"
      # ENABLE_UNIVERSE_DISCOVERY: "true"
      # ENABLE_WATCH_PARTY: "true"
      # ENABLE_RATING_BIAS_DETECTOR: "true"

    volumes:
      - suite-cache:/app/cache
      - suite-models:/app/models
      - suite-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: emby-simkl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: embysimkl
      POSTGRES_PASSWORD: embysimkl-internal-only
      POSTGRES_DB: embysimkl
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U embysimkl"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: emby-simkl-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  suite-cache:
  suite-models:
  suite-logs:
